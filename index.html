<!DOCTYPE html>

<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💰 我的記帳本</title>

<!-- =========================================================
     Chart.js
     ========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
    --bg:#fff9df;
    --surface:#fffdf3;
    --surface-2:#fff3bd;
    --border:#eadca7;
    --text:#4b3621;
    --muted:#8b7355;
    --primary:#b86b22;
    --primary-dark:#7b4315;
    --accent:#f4c95d;
    --danger:#c94c4c;
    --success:#4d8b57;
    --shadow:0 8px 28px rgba(111,75,28,.10);
    --radius:18px;
    --font-size:16px;
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
    font-size:var(--font-size);
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    transition:.25s;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

body.dark{
    --bg:#211a12;
    --surface:#2c2319;
    --surface-2:#3a2d1d;
    --border:#58452d;
    --text:#fff3d1;
    --muted:#c5aa7c;
    --primary:#f0a34a;
    --primary-dark:#ffd08a;
    --accent:#b77a27;
    --shadow:0 8px 28px rgba(0,0,0,.30);
}

/* =========================================================
   App Header
   ========================================================= */

.app-header{
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(255,253,243,.94);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);
}

.dark .app-header{
    background:rgba(44,35,25,.94);
}

.header-inner{
    max-width:1400px;
    margin:auto;
    min-height:74px;
    padding:12px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:18px;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
}

.brand-icon{
    width:44px;
    height:44px;
    border-radius:14px;
    display:grid;
    place-items:center;
    background:var(--surface-2);
    font-size:24px;
    flex:none;
}

.brand-title{
    font-size:22px;
    font-weight:900;
    white-space:nowrap;
}

.user-area{
    display:flex;
    align-items:center;
    gap:8px;
}

.user-status{
    color:var(--muted);
    font-size:13px;
    max-width:210px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.header-actions{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    justify-content:flex-end;
}

.btn{
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    border-radius:12px;
    padding:9px 13px;
    font-weight:700;
    transition:.18s;
}

.btn:hover{
    transform:translateY(-1px);
    box-shadow:0 5px 14px rgba(120,80,20,.12);
}

.btn-primary{
    background:var(--primary);
    color:white;
    border-color:var(--primary);
}

.btn-danger{
    background:var(--danger);
    color:white;
    border-color:var(--danger);
}

.btn-success{
    background:var(--success);
    color:white;
    border-color:var(--success);
}

.icon-btn{
    width:42px;
    height:42px;
    padding:0;
    display:grid;
    place-items:center;
    border-radius:12px;
}

.font-control{
    display:flex;
    align-items:center;
    gap:7px;
    padding:7px 10px;
    border:1px solid var(--border);
    background:var(--surface);
    border-radius:12px;
}

.font-control input{
    width:90px;
}

/* =========================================================
   Main
   ========================================================= */

main{
    max-width:1400px;
    margin:auto;
    padding:22px;
}

/* =========================================================
   Dashboard
   ========================================================= */

.dashboard{
    min-height:230px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
    margin-bottom:20px;
}

.stat-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:24px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.stat-label{
    color:var(--muted);
    font-weight:700;
    margin-bottom:8px;
}

.stat-number{
    font-size:clamp(36px,5vw,58px);
    font-weight:950;
    color:var(--primary);
    line-height:1.05;
}

.stat-unit{
    font-size:15px;
    color:var(--muted);
    margin-top:6px;
}

/* =========================================================
   Quick filters
   ========================================================= */

.quick-filter{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:10px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:18px;
}

.filter-btn{
    border:0;
    background:transparent;
    color:var(--muted);
    border-radius:10px;
    padding:9px 14px;
    font-weight:800;
}

.filter-btn.active{
    background:var(--primary);
    color:white;
}

/* =========================================================
   Chart
   ========================================================= */

.chart-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:20px;
    box-shadow:var(--shadow);
}

.chart-title{
    font-size:17px;
    font-weight:900;
    margin-bottom:12px;
}

.chart-container{
    height:260px;
    position:relative;
}

.no-chart{
    height:100%;
    display:grid;
    place-items:center;
    color:var(--muted);
}

/* =========================================================
   History
   ========================================================= */

.history-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
}

.history-toolbar{
    padding:15px;
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    border-bottom:1px solid var(--border);
}

.search-box{
    flex:1;
    min-width:220px;
    border:1px solid var(--border);
    border-radius:12px;
    background:var(--bg);
    color:var(--text);
    padding:11px 14px;
    outline:none;
}

.search-box:focus{
    border-color:var(--primary);
}

.tool-btn{
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    padding:10px 13px;
    border-radius:11px;
    font-weight:800;
}

.table-wrap{
    width:100%;
    overflow-x:auto;
}

.history-table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
}

.history-table th,
.history-table td{
    padding:14px 16px;
    border-bottom:1px solid var(--border);
    text-align:left;
    vertical-align:middle;
}

.history-table th{
    background:var(--surface-2);
    font-weight:900;
    white-space:nowrap;
}

.history-table th:nth-child(1),
.history-table td:nth-child(1){
    width:110px;
    text-align:center;
}

.history-table th:nth-child(2),
.history-table td:nth-child(2){
    width:150px;
}

.history-table th:nth-child(3),
.history-table td:nth-child(3){
    width:auto;
}

.history-table th:nth-child(4),
.history-table td:nth-child(4){
    width:180px;
    text-align:right;
}

.history-table th:nth-child(5),
.history-table td:nth-child(5){
    width:180px;
}

.sort-btn{
    border:0;
    background:transparent;
    color:inherit;
    font-weight:900;
    padding:4px;
}

.record-row{
    cursor:pointer;
    transition:.18s;
}

.record-row:hover{
    background:rgba(244,201,93,.14);
}

.amount-cell{
    text-align:right !important;
    color:var(--primary-dark);
    font-weight:950;
    font-size:18px;
}

.category-tag{
    display:inline-flex;
    align-items:center;
    padding:5px 9px;
    border-radius:999px;
    font-size:12px;
    font-weight:900;
    white-space:nowrap;
}

.cat-餐飲{background:#ffe0d2;color:#9d3d16}
.cat-交通{background:#d9ebff;color:#1f5e91}
.cat-購物{background:#f4dcff;color:#793f91}
.cat-娛樂{background:#dff3dc;color:#357137}
.cat-房租{background:#ffe8a9;color:#7a5a00}
.cat-醫療{background:#ffd9e2;color:#9a3450}
.cat-其他{background:#e6e6e6;color:#555}

.dark .cat-餐飲{background:#67351f;color:#ffd2b7}
.dark .cat-交通{background:#1d496b;color:#b7ddff}
.dark .cat-購物{background:#59356b;color:#f1caff}
.dark .cat-娛樂{background:#28502a;color:#c7f1c2}
.dark .cat-房租{background:#66501b;color:#ffeaa0}
.dark .cat-醫療{background:#663344;color:#ffc6d5}
.dark .cat-其他{background:#4c4c4c;color:#ddd}

.time-desktop{
    white-space:nowrap;
    color:var(--muted);
    font-size:14px;
}

.row-actions{
    display:flex;
    justify-content:flex-end;
    gap:5px;
    opacity:0;
    transition:.18s;
}

.record-row:hover .row-actions{
    opacity:1;
}

.mini-btn{
    width:34px;
    height:34px;
    border:1px solid var(--border);
    border-radius:9px;
    background:var(--surface);
}

/* =========================================================
   Mobile Cards
   ========================================================= */

.mobile-list{
    display:none;
}

.mobile-record{
    position:relative;
    padding:16px;
    border-bottom:1px solid var(--border);
    cursor:pointer;
}

.mobile-record:last-child{
    border-bottom:0;
}

.mobile-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
}

.mobile-amount{
    font-size:29px;
    line-height:1;
    font-weight:950;
    color:var(--primary);
    white-space:nowrap;
}

.mobile-content{
    font-size:17px;
    font-weight:850;
    margin-top:9px;
    word-break:break-word;
}

.mobile-meta{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:11px;
    color:var(--muted);
    font-size:13px;
}

.mobile-time{
    display:flex;
    flex-direction:column;
    gap:2px;
}

.mobile-row-actions{
    display:flex;
    gap:6px;
}

.mobile-row-actions .mini-btn{
    opacity:.8;
}

/* =========================================================
   Empty
   ========================================================= */

.empty{
    padding:45px 20px;
    text-align:center;
    color:var(--muted);
}

/* =========================================================
   Modal
   ========================================================= */

.modal{
    position:fixed;
    inset:0;
    z-index:500;
    background:rgba(30,20,10,.52);
    backdrop-filter:blur(5px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
}

.modal.active{
    display:flex;
}

.modal-box{
    width:min(620px,100%);
    max-height:90vh;
    overflow:auto;
    background:var(--surface);
    color:var(--text);
    border-radius:22px;
    border:1px solid var(--border);
    box-shadow:0 25px 70px rgba(0,0,0,.25);
}

.modal-header{
    position:sticky;
    top:0;
    z-index:2;
    background:var(--surface);
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 20px;
    border-bottom:1px solid var(--border);
}

.modal-header h2{
    margin:0;
    font-size:20px;
}

.close-btn{
    width:38px;
    height:38px;
    border:0;
    background:transparent;
    color:var(--muted);
    font-size:26px;
}

.modal-body{
    padding:20px;
}

.modal-footer{
    display:flex;
    gap:9px;
    justify-content:flex-end;
    padding:16px 20px;
    border-top:1px solid var(--border);
}

.detail-grid{
    display:grid;
    grid-template-columns:130px 1fr;
    gap:13px;
}

.detail-label{
    color:var(--muted);
    font-weight:800;
}

.detail-value{
    font-weight:700;
    word-break:break-word;
}

.form-group{
    margin-bottom:15px;
}

.form-label{
    display:block;
    margin-bottom:7px;
    font-weight:850;
}

.form-control{
    width:100%;
    border:1px solid var(--border);
    border-radius:11px;
    padding:11px 12px;
    background:var(--bg);
    color:var(--text);
    outline:none;
}

.form-control:focus{
    border-color:var(--primary);
}

.amount-shortcuts{
    display:flex;
    gap:7px;
    margin-top:7px;
}

.amount-shortcuts button{
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--primary-dark);
    border-radius:9px;
    padding:6px 10px;
    font-weight:900;
}

.location-row{
    display:flex;
    gap:8px;
}

.location-row .form-control{
    flex:1;
}

.map-btn{
    flex:none;
}

/* =========================================================
   Data management
   ========================================================= */

.dropdown{
    position:relative;
}

.dropdown-menu{
    position:absolute;
    right:0;
    top:calc(100% + 7px);
    width:190px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:13px;
    box-shadow:var(--shadow);
    padding:6px;
    display:none;
    z-index:200;
}

.dropdown.open .dropdown-menu{
    display:block;
}

.dropdown-item{
    width:100%;
    text-align:left;
    border:0;
    background:transparent;
    color:var(--text);
    border-radius:9px;
    padding:10px;
    font-weight:700;
}

.dropdown-item:hover{
    background:var(--surface-2);
}

.hidden-file{
    display:none;
}

/* =========================================================
   Category filter menu
   ========================================================= */

.category-menu-wrap{
    position:relative;
}

.category-menu{
    position:absolute;
    right:0;
    top:calc(100% + 7px);
    width:190px;
    max-height:260px;
    overflow-y:auto;
    overscroll-behavior:contain;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:13px;
    box-shadow:var(--shadow);
    padding:6px;
    display:none;
    z-index:220;
}

.category-menu.open{
    display:block;
}

.category-option{
    width:100%;
    text-align:left;
    border:0;
    background:transparent;
    color:var(--text);
    padding:11px 10px;
    border-radius:9px;
    font-weight:750;
}

.category-option:hover,
.category-option.active{
    background:var(--surface-2);
}

/* =========================================================
   Toast
   ========================================================= */

.toast{
    position:fixed;
    top:85px;
    left:50%;
    transform:translate(-50%,-15px);
    z-index:1000;
    opacity:0;
    pointer-events:none;
    background:#4b3621;
    color:white;
    padding:11px 18px;
    border-radius:999px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
    transition:.25s;
    font-weight:800;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

.toast.error{
    background:#a33e3e;
}

/* =========================================================
   Responsive
   ========================================================= */

@media(max-width:900px){
    .user-status{
        display:none;
    }

    .header-inner{
        padding:10px 14px;
    }

    main{
        padding:14px;
    }

    .history-table th:nth-child(5),
    .history-table td:nth-child(5){
        display:none;
    }
}

@media(max-width:600px){

    body{
        font-size:17px;
    }

    .app-header{
        position:relative;
    }

    .header-inner{
        min-height:auto;
        padding:10px 12px;
        gap:8px;
    }

    .brand{
        flex:1;
    }

    .brand-icon{
        width:40px;
        height:40px;
    }

    .brand-title{
        font-size:19px;
    }

    .header-actions{
        gap:5px;
    }

    .font-control{
        display:none;
    }

    .header-actions > .theme-btn{
        display:grid;
    }

    .header-actions > .add-btn{
        width:43px;
        height:43px;
        padding:0;
        font-size:23px;
    }

    .header-actions > .add-btn span{
        display:none;
    }

    .dashboard{
        grid-template-columns:1fr;
        min-height:auto;
        gap:10px;
    }

    .stat-card{
        padding:18px;
    }

    .stat-number{
        font-size:42px;
    }

    .quick-filter{
        overflow-x:auto;
        flex-wrap:nowrap;
        scrollbar-width:none;
    }

    .quick-filter::-webkit-scrollbar{
        display:none;
    }

    .filter-btn{
        white-space:nowrap;
        min-height:45px;
        padding:9px 13px;
    }

    .chart-container{
        height:230px;
    }

    .history-toolbar{
        padding:11px;
        display:grid;
        grid-template-columns:1fr auto auto;
        gap:7px;
    }

    .search-box{
        min-width:0;
        width:100%;
        grid-column:1 / -1;
        font-size:16px;
    }

    .tool-btn{
        min-height:44px;
        padding:8px 11px;
    }

    .table-wrap{
        display:none;
    }

    .mobile-list{
        display:block;
    }

    .mobile-record{
        padding:17px 15px;
    }

    .mobile-amount{
        font-size:31px;
    }

    .mobile-content{
        font-size:17px;
    }

    .mobile-meta{
        font-size:13px;
    }

    .mobile-row-actions{
        display:none;
    }

    .detail-grid{
        grid-template-columns:100px 1fr;
    }

    .modal{
        padding:10px;
    }

    .modal-box{
        max-height:94vh;
        border-radius:18px;
    }

    .modal-body{
        padding:16px;
    }

    .modal-footer{
        padding:13px 16px;
        flex-wrap:wrap;
    }

    .modal-footer .btn{
        flex:1;
        min-height:46px;
    }

    .location-row{
        flex-direction:column;
    }

    .map-btn{
        width:100%;
    }

    .toast{
        top:18px;
        width:max-content;
        max-width:90vw;
    }
}

/* Accessibility */
button:focus-visible,
input:focus-visible,
select:focus-visible{
    outline:3px solid rgba(184,107,34,.3);
    outline-offset:2px;
}
</style>

</head>

<main>

```
<!-- =====================================================
     Dashboard
     ===================================================== -->

<section class="dashboard">

    <div class="stat-card">
        <div class="stat-label">總消費次數</div>
        <div id="totalCount" class="stat-number">0</div>
        <div class="stat-unit">筆記錄</div>
    </div>

    <div class="stat-card">
        <div class="stat-label">總消費金額</div>
        <div id="totalAmount" class="stat-number">NT$ 0.00</div>

/* =========================================================

/* =========================================================

const firebaseConfig = {

};

const firebaseApp = initializeApp(firebaseConfig);

const auth = getAuth(firebaseApp);

const db = getFirestore(firebaseApp);

const googleProvider = new GoogleAuthProvider();

googleProvider.setCustomParameters({

});


/* =========================================================
   常數
   ========================================================= */

const STORAGE_KEY = "accountingRecords";

const CATEGORIES = [
    "餐飲",
    "交通",
    "購物",
    "娛樂",
    "房租",
    "醫療",
    "其他"
];

let records = [];

let currentUser = null;

let selectedRecordId = null;

let editingRecordId = null;

let unsubscribeFirestore = null;

let chart = null;

let activePeriod = "all";

let activeCategory = "all";

let searchText = "";

let sortField = "time";

let sortDirection = "desc";


/* =========================================================
   DOM
   ========================================================= */

const $ = id => document.getElementById(id);

const tableBody = $("tableBody");

const mobileList = $("mobileList");

const totalCount = $("totalCount");

const totalAmount = $("totalAmount");

const detailModal = $("detailModal");

const formModal = $("formModal");

const detailBody = $("detailBody");

const recordForm = $("recordForm");

const amountInput = $("amountInput");

const contentInput = $("contentInput");

const timeInput = $("timeInput");

const locationInput = $("locationInput");

const categoryInput = $("categoryInput");

const formTitle = $("formTitle");

const saveRecordBtn = $("saveRecordBtn");

const toast = $("toast");

const categoryChartCanvas = $("categoryChart");

const noChart = $("noChart");


/* =========================================================
   Utility
   ========================================================= */

function escapeHtml(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


function formatMoney(value){

    return Number(value || 0).toLocaleString(
        "zh-TW",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );
}


function localDateTimeValue(date = new Date()){

    const offset = date.getTimezoneOffset();

    const local = new Date(
        date.getTime() - offset * 60000
    );

    return local
        .toISOString()
        .slice(0,16);
}


function formatDesktopTime(value){

    if(!value) return "-";

    const d = new Date(value);

    if(Number.isNaN(d.getTime())) return value;

    return d.toLocaleString(
        "zh-TW",
        {
            year:"numeric",
            month:"2-digit",
            day:"2-digit",
            hour:"2-digit",
            minute:"2-digit",
            hour12:false
        }
    ).replace(/\//g,"/");
}


function formatMobileDate(value){

    if(!value) return ["-",""];

    const d = new Date(value);

    if(Number.isNaN(d.getTime())) return [value,""];

    return [
        d.toLocaleDateString(
            "zh-TW",
            {
                year:"numeric",
                month:"2-digit",
                day:"2-digit"
            }
        ),
        d.toLocaleTimeString(
            "zh-TW",
            {
                hour:"2-digit",
                minute:"2-digit",
                hour12:false
            }
        )
    ];
}


function showToast(message,type="success"){

    toast.textContent = message;

    toast.className = "toast show";

    if(type === "error"){
        toast.classList.add("error");
    }

    clearTimeout(showToast.timer);

    showToast.timer = setTimeout(()=>{
        toast.classList.remove("show");
    },2000);
}


function getNextId(){

    if(!records.length) return 1;

    return Math.max(
        ...records.map(r => Number(r.id) || 0)
    ) + 1;
}


/* =========================================================
   LocalStorage
   ========================================================= */

function loadLocalData(){

    try{

        const raw = localStorage.getItem(STORAGE_KEY);

        if(!raw){
            records = [];
            return;
        }

        const parsed = JSON.parse(raw);

        records = Array.isArray(parsed)
            ? parsed
            : [];

    }catch(error){

        console.error(error);

        records = [];

    }
}


function saveLocalData(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(records)
    );
}


/* =========================================================
   Firebase Firestore
   路徑：
   users/{uid}/records/{recordId}
   ========================================================= */

function getUserRecordsCollection(){

    if(!currentUser) return null;

    return collection(
        db,
        "users",
        currentUser.uid,
        "records"
    );
}


async function loadFirebaseRecords(){

    if(!currentUser) return;

    try{

        const ref = getUserRecordsCollection();

        const snapshot = await getDocs(ref);

        const cloudRecords = snapshot.docs.map(
            item => ({
                id:Number(item.data().id),
                ...item.data()
            })
        );

        records = cloudRecords.sort(
            (a,b)=>Number(a.id)-Number(b.id)
        );

        saveLocalData();

        render();

        showToast("☁️ 已載入 Firebase 資料");

    }catch(error){

        console.error(
            "Firestore 載入失敗：",
            error
        );

        showToast(
            "⚠️ Firebase 載入失敗，暫時使用本機資料",
            "error"
        );

        loadLocalData();

        render();

    }
}


async function saveRecordToFirebase(record){

    if(!currentUser) return;

    try{

        const recordRef = doc(
            db,
            "users",
            currentUser.uid,
            "records",
            String(record.id)
        );

        await setDoc(
            recordRef,
            record
        );

    }catch(error){

        console.error(
            "Firebase 儲存失敗：",
            error
        );

        showToast(
            "⚠️ Firebase 儲存失敗，但本機資料已保存",
            "error"
        );

    }
}


async function deleteRecordFromFirebase(id){

    if(!currentUser) return;

    try{

        const recordRef = doc(
            db,
            "users",
            currentUser.uid,
            "records",
            String(id)
        );

        await deleteDoc(recordRef);

    }catch(error){

        console.error(error);

        showToast(
            "⚠️ Firebase 刪除失敗",
            "error"
        );

    }
}


/* =========================================================
   Firebase 即時監聽
   ========================================================= */

function subscribeFirebase(){

    if(unsubscribeFirestore){

        unsubscribeFirestore();

        unsubscribeFirestore = null;

    }

    if(!currentUser) return;

    const ref = getUserRecordsCollection();

    unsubscribeFirestore = onSnapshot(
        ref,
        snapshot => {

            const cloudRecords =
                snapshot.docs.map(
                    item => ({
                        id:Number(item.data().id),
                        ...item.data()
                    })
                );

            records = cloudRecords.sort(
                (a,b)=>Number(a.id)-Number(b.id)
            );

            saveLocalData();

            render();

        },
        error => {

            console.error(
                "Firestore 即時同步失敗：",
                error
            );

        }
    );
}


/* =========================================================
   Filter
   ========================================================= */

function isSameDay(a,b){

    return a.getFullYear() === b.getFullYear()
        && a.getMonth() === b.getMonth()
        && a.getDate() === b.getDate();
}


function getStartOfWeek(date){

    const d = new Date(date);

    const day = d.getDay();

    const diff = day === 0 ? 6 : day - 1;

    d.setHours(0,0,0,0);

    d.setDate(d.getDate() - diff);

    return d;
}


function filterRecords(){

    const now = new Date();

    let result = [...records];

    if(activePeriod === "today"){

        result = result.filter(r =>
            isSameDay(
                new Date(r.time),
                now
            )
        );

    }

    if(activePeriod === "week"){

        const start = getStartOfWeek(now);

        result = result.filter(r =>
            new Date(r.time) >= start
        );

    }

    if(activePeriod === "month"){

        result = result.filter(r => {

            const d = new Date(r.time);

            return d.getFullYear() === now.getFullYear()
                && d.getMonth() === now.getMonth();

        });

    }

    if(activeCategory !== "all"){

        result = result.filter(
            r => r.category === activeCategory
        );

    }

    if(searchText){

        const q = searchText.toLowerCase();

        result = result.filter(r =>
            String(r.content || "")
                .toLowerCase()
                .includes(q)
            ||
            String(r.location || "")
                .toLowerCase()
                .includes(q)
        );

    }

    result.sort((a,b)=>{

        let av;
        let bv;

        if(sortField === "amount"){

            av = Number(a.amount);
            bv = Number(b.amount);

        }else if(sortField === "id"){

            av = Number(a.id);
            bv = Number(b.id);

        }else if(sortField === "content"){

            av = String(a.content || "");

            bv = String(b.content || "");

        }else{

            av = new Date(a.time).getTime();

            bv = new Date(b.time).getTime();

        }

        if(av < bv)
            return -1 * sortDirection;

        if(av > bv)
            return 1 * sortDirection;

        return 0;

    });

    return result;
}


/* =========================================================
   Render
   ========================================================= */

function render(){

    const visible = filterRecords();

    renderStats(visible);

    renderTable(visible);

    renderMobile(visible);

    renderChart(visible);

}

    totalCount.textContent = list.length;

    const sum = list.reduce(

/* =========================================================

function renderMobile(list){

        mobileList.innerHTML = `

}


/* =========================================================
   Chart.js
   ========================================================= */

function renderChart(list){

    const totals = {};

    CATEGORIES.forEach(
        category => totals[category] = 0
    );

    list.forEach(record => {

        const category =
            CATEGORIES.includes(record.category)
                ? record.category
                : "其他";

        totals[category] +=
            Number(record.amount || 0);

    });

    const labels = CATEGORIES.filter(
        category => totals[category] > 0
    );

    const values = labels.map(
        category => totals[category]
    );

    if(chart){

        chart.destroy();

        chart = null;

    }

    if(!labels.length){

        categoryChartCanvas.style.display = "none";

        noChart.style.display = "grid";

        return;

    }

    categoryChartCanvas.style.display = "block";

    noChart.style.display = "none";

    /*
      保留明確顏色。
      之前圖表變成沒有顏色，
      通常是因為 dataset backgroundColor 沒有指定。
    */

    const colors = [
        "#f28e2b",
        "#4e79a7",
        "#b07aa1",
        "#59a14f",
        "#edc949",
        "#e15759",
        "#9c9c9c"
    ];

    chart = new Chart(
        categoryChartCanvas,
        {
            type:"pie",

            data:{
                labels,

                datasets:[{

                    data:values,

                    backgroundColor:
                        labels.map(
                            label =>
                                colors[
                                    CATEGORIES.indexOf(label)
                                ]
                        ),

                    borderColor:
                        getComputedStyle(document.body)
                            .getPropertyValue("--surface"),

                    borderWidth:3

                }]
            },

            options:{

                responsive:true,

                maintainAspectRatio:false,

                plugins:{
                    legend:{
                        position:"bottom",

                        labels:{
                            color:
                                getComputedStyle(document.body)
                                    .getPropertyValue("--text")
                        }
                    },

                    tooltip:{
                        callbacks:{
                            label:function(context){

                                const total =
                                    context.dataset.data
                                        .reduce(
                                            (a,b)=>a+b,
                                            0
                                        );

                                const value =
                                    context.raw;

                                const percent =
                                    total
                                        ? (value / total * 100)
                                        : 0;

                                return `${context.label}：NT$ ${formatMoney(value)} (${percent.toFixed(1)}%)`;

                            }
                        }
                    }
                }
            }
        }
    );

recordForm.addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        const amount =
            Number(amountInput.value);

        const content =
            contentInput.value.trim();

        if(!Number.isFinite(amount) || amount < 0){

            showToast(
                "⚠️ 請輸入有效金額",
                "error"
            );

            return;

        }

        if(!content){

            showToast(
                "⚠️ 請輸入消費內容",
                "error"
            );

            return;

        }

        if(editingRecordId === null){

            const record = {

                id:getNextId(),

                amount:Number(
                    amount.toFixed(2)
                ),

                content,

                time:timeInput.value,

                location:
                    locationInput.value.trim(),

                category:
                    categoryInput.value || "其他"

            };

            records.push(record);

            saveLocalData();

            if(currentUser){

                await saveRecordToFirebase(record);

            }

            closeModal(formModal);

            render();

            showToast("✅ 已新增消費記錄");

        }else{

            const index =
                records.findIndex(
                    r =>
                        Number(r.id)
                        === Number(editingRecordId)
                );

            if(index === -1) return;

            const record = {

                ...records[index],

                amount:Number(
                    amount.toFixed(2)
                ),

                content,

                time:timeInput.value,

                location:
                    locationInput.value.trim(),

                category:
                    categoryInput.value || "其他"

            };

            records[index] = record;

            saveLocalData();

            if(currentUser){

                await saveRecordToFirebase(record);

            }

            closeModal(formModal);

            render();

            showToast("✅ 已更新記錄");

        }

    }
);

/* =========================================================
   CSV Export
   ========================================================= */

function csvEscape(value){

    const text =
        String(value ?? "");

    return `"${text.replaceAll('"','""')}"`;

}


function exportCSV(){

    if(!records.length){

        showToast(
            "📭 目前沒有資料可以匯出",
            "error"
        );

        return;

    }

    /*
      Excel / CSV 標題列固定：
      消費序號、消費內容、消費金額、消費時間
    */

    const header =
        [
            "消費序號",
            "消費內容",
            "消費金額",
            "消費時間",
            "消費地點",
            "消費類別"
        ]
        .map(csvEscape)
        .join(",");

    const rows =
        records.map(record =>
            [
                record.id,
                record.content,
                Number(record.amount).toFixed(2),
                formatDesktopTime(record.time),
                record.location || "",
                record.category || "其他"
            ]
            .map(csvEscape)
            .join(",")
        );

    /*
      加 BOM，確保 Excel 正確顯示繁體中文。
    */

    const csv =
        "\uFEFF"
        + header
        + "\r\n"
        + rows.join("\r\n");

    const blob =
        new Blob(
            [csv],
            {
                type:"text/csv;charset=utf-8;"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;

    a.download =
        `我的記帳本_${new Date()
            .toISOString()
            .slice(0,10)}.csv`;

    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(url);

    showToast("📤 CSV 匯出成功");

}


/* =========================================================
   JSON Import
   ========================================================= */

async function importJSON(text){

    const parsed =
        JSON.parse(text);

    if(!Array.isArray(parsed)){

        throw new Error(
            "JSON 必須是一個陣列"
        );

    }

    const imported =
        parsed.map((item,index)=>({

            id:Number(item.id) || index + 1,

            amount:Number(
                item.amount
                ?? item["消費金額"]
                ?? 0
            ),

            content:
                item.content
                ?? item["消費內容"]
                ?? "",

            time:
                item.time
                ?? item["消費時間"]
                ?? localDateTimeValue(),

            location:
                item.location
                ?? item["消費地點"]
                ?? "",

            category:
                item.category
                ?? item["消費類別"]
                ?? "其他"

        }));

    records = imported;

}


/* =========================================================
   CSV Import
   ========================================================= */

function parseCSV(text){

    const lines =
        text
            .replace(/^\uFEFF/,"")
            .split(/\r?\n/)
            .filter(line => line.trim());

    if(lines.length < 2){

        throw new Error(
            "CSV 沒有資料"
        );

    }

    function parseLine(line){

        const result = [];

        let current = "";

        let insideQuotes = false;

        for(let i=0;i<line.length;i++){

            const char = line[i];

            if(char === '"'){

                if(
                    insideQuotes
                    && line[i+1] === '"'
                ){

                    current += '"';

                    i++;

                }else{

                    insideQuotes =
                        !insideQuotes;

                }

            }else if(
                char === ","
                && !insideQuotes
            ){

                result.push(current);

                current = "";

            }else{

                current += char;

            }

        }

        result.push(current);

        return result;

    }

    const header =
        parseLine(lines[0]);

    const rows =
        lines.slice(1)
            .map(parseLine);

    const indexOf =
        name => header.indexOf(name);

    const idIndex =
        indexOf("消費序號");

    const contentIndex =
        indexOf("消費內容");

    const amountIndex =
        indexOf("消費金額");

    const timeIndex =
        indexOf("消費時間");

    const locationIndex =
        indexOf("消費地點");

    const categoryIndex =
        indexOf("消費類別");

    if(
        contentIndex === -1
        || amountIndex === -1
    ){

        throw new Error(
            "CSV 缺少必要欄位"
        );

    }

    records =
        rows.map((row,index)=>({

            id:
                Number(
                    idIndex >= 0
                        ? row[idIndex]
                        : index + 1
                ),

            content:
                row[contentIndex] || "",

            amount:
                Number(
                    row[amountIndex] || 0
                ),

            time:
                timeIndex >= 0
                    ? convertImportedTime(
                        row[timeIndex]
                    )
                    : localDateTimeValue(),

            location:
                locationIndex >= 0
                    ? row[locationIndex]
                    : "",

            category:
                categoryIndex >= 0
                    ? row[categoryIndex]
                    : "其他"

        }));

}


function convertImportedTime(value){

    if(!value) return localDateTimeValue();

    /*
      優先處理我們自己匯出的：
      YYYY/MM/DD HH:mm
    */

    const match =
        String(value).match(
            /^(\d{4})\/(\d{2})\/(\d{2})\s+(\d{2}):(\d{2})$/
        );

    if(match){

        return `${match[1]}-${match[2]}-${match[3]}T${match[4]}:${match[5]}`;

    }

    const d = new Date(value);

    if(!Number.isNaN(d.getTime())){

        return localDateTimeValue(d);

    }

    return value;

}

        try{

            const text =
                await file.text();

            if(
                file.name
                    .toLowerCase()
                    .endsWith(".json")
            ){

                await importJSON(text);

            }else{

                parseCSV(text);

            }

            /*
              重新整理 ID，避免匯入後出現
              重複或非數字 ID。
            */

            records =
                records.map(
                    (record,index)=>({

                        ...record,

                        id:index + 1,

                        amount:Number(
                            Number(record.amount || 0)
                                .toFixed(2)
                        )

                    })
                );

            saveLocalData();

            if(currentUser){

                /*
                  匯入資料後寫入 Firebase。
                  先寫入新資料。

                for(const record of records){

                    await saveRecordToFirebase(
                        record
                    );

                }

            }

            render();

            showToast("📥 匯入成功");

        }catch(error){

            console.error(error);

    );

}


/* =========================================================
   Auth State
   ========================================================= */

onAuthStateChanged(
    auth,
    async user => {

        currentUser = user;

        if(user){

            $("loginBtn").style.display =
                "none";

            $("logoutBtn").style.display =
                "inline-block";

            $("userStatus").textContent =
                `✅ ${user.displayName || user.email}`;

            /*
              登入後：
              1. 讀取該 UID 的 Firestore 資料
              2. 建立即時監聽
            */

            await loadFirebaseRecords();

            subscribeFirebase();

        }else{

            $("loginBtn").style.display =
                "inline-block";

            $("logoutBtn").style.display =
                "none";

            $("userStatus").textContent =
                "🔒 未登入";

            if(unsubscribeFirestore){

                unsubscribeFirestore();

                unsubscribeFirestore = null;

            }

            loadLocalData();

            render();

        }

    }
);


/* =========================================================
   Initial Local Data
   ========================================================= */

loadLocalData();

render();

</script>

</body>
</html>
