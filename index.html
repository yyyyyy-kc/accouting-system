<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>💰 我的記帳本</title>

  <!-- =========================================================
       Chart.js
       ========================================================= -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    /* =========================================================
       基礎設定
       ========================================================= */

    :root {
      --bg: #fff9df;
      --bg-soft: #fffdf2;
      --card: #fffef8;
      --card-2: #fff6c9;

      --primary: #f5d76e;
      --primary-dark: #d49a22;

      --brown: #704214;
      --brown-dark: #4e2c10;
      --orange: #c86b1d;

      --text: #4b3824;
      --text-soft: #806b52;
      --border: #eadcae;

      --danger: #b83b32;
      --success: #5b8c45;

      --shadow: 0 8px 28px rgba(99, 69, 25, 0.10);

      --font-size: 16px;

      --radius: 18px;
    }

    body.dark {
      --bg: #211c14;
      --bg-soft: #292218;
      --card: #30281d;
      --card-2: #3a2f20;

      --primary: #d6af43;
      --primary-dark: #f0ca5a;

      --brown: #f4dfaa;
      --brown-dark: #fff0c4;
      --orange: #e59645;

      --text: #f5ead0;
      --text-soft: #cbbd9f;
      --border: #56462d;

      --danger: #e07167;
      --success: #8fbd70;

      --shadow: 0 8px 28px rgba(0, 0, 0, 0.25);
    }

    * {
      box-sizing: border-box;
    }

    html {
      font-size: var(--font-size);
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;

      color: var(--text);
      background:
        radial-gradient(
          circle at top left,
          rgba(255, 232, 147, 0.35),
          transparent 32%
        ),
        var(--bg);

      transition:
        background 0.25s ease,
        color 0.25s ease;

      min-height: 100vh;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================================================
       App Layout
       ========================================================= */

    .app {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* =========================================================
       Header
       ========================================================= */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;

      min-height: 72px;
      padding: 12px 28px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;

      background: rgba(255, 250, 224, 0.94);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(15px);

      transition: background 0.25s ease;
    }

    body.dark .topbar {
      background: rgba(33, 28, 20, 0.94);
    }

    .brand-area {
      display: flex;
      align-items: center;
      gap: 18px;
      min-width: 0;
    }

    .brand {
      font-size: 1.35rem;
      font-weight: 900;
      color: var(--brown-dark);
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);

      border-radius: 12px;
      min-height: 42px;
      padding: 8px 14px;

      font-weight: 700;

      transition:
        transform 0.15s ease,
        background 0.15s ease,
        box-shadow 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 5px 14px rgba(92, 63, 20, 0.10);
    }

    .btn-primary {
      background: var(--brown);
      color: #fff9df;
      border-color: var(--brown);
    }

    .btn-primary:hover {
      background: var(--brown-dark);
    }

    .btn-danger {
      background: var(--danger);
      color: white;
      border-color: var(--danger);
    }

    .btn-small {
      min-height: 34px;
      padding: 5px 10px;
      border-radius: 9px;
      font-size: 0.85rem;
    }

    .login-btn {
      border: none;
      background: transparent;
      color: var(--brown);
      font-weight: 800;
      padding: 8px 10px;
      border-radius: 9px;
    }

    .login-btn:hover {
      background: var(--card-2);
    }

    .font-control {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 10px;

      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card);
    }

    .font-control span {
      font-size: 0.82rem;
      white-space: nowrap;
    }

    .font-control input {
      width: 85px;
      accent-color: var(--orange);
    }

    .mobile-menu {
      display: none;
    }

    /* =========================================================
       Main
       ========================================================= */

    main {
      width: min(1500px, 100%);
      margin: 0 auto;
      padding: 22px 28px 40px;
      flex: 1;
    }

    /* =========================================================
       Dashboard
       ========================================================= */

    .dashboard {
      min-height: 25vh;

      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;

      margin-bottom: 20px;
    }

    .stat-card {
      position: relative;
      overflow: hidden;

      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);

      box-shadow: var(--shadow);

      padding: 26px 30px;

      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .stat-card::after {
      content: "";
      position: absolute;
      width: 130px;
      height: 130px;
      border-radius: 50%;

      right: -45px;
      top: -45px;

      background: rgba(245, 215, 110, 0.23);
    }

    .stat-label {
      color: var(--text-soft);
      font-weight: 800;
      font-size: 0.95rem;
      margin-bottom: 8px;
    }

    .stat-number {
      font-size: clamp(2rem, 4vw, 3.4rem);
      font-weight: 950;
      color: var(--brown-dark);
      letter-spacing: -1px;
    }

    .stat-number.money {
      color: var(--orange);
    }

    .filter-bar {
      grid-column: 1 / -1;

      display: flex;
      align-items: center;
      gap: 8px;

      overflow-x: auto;
      padding: 3px 0 8px;
      scrollbar-width: thin;
    }

    .filter-btn {
      flex: 0 0 auto;

      padding: 9px 15px;
      border-radius: 999px;

      border: 1px solid var(--border);
      background: var(--card);

      color: var(--text);
      font-weight: 750;
    }

    .filter-btn.active {
      background: var(--brown);
      color: white;
      border-color: var(--brown);
    }

    /* =========================================================
       Chart
       ========================================================= */

    .chart-section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);

      margin-bottom: 22px;
      padding: 20px;

      min-height: 280px;
    }

    .section-title {
      font-weight: 900;
      font-size: 1.05rem;
      margin-bottom: 10px;
    }

    .chart-wrapper {
      height: 245px;
      position: relative;
    }

    .empty-chart {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-soft);
      font-weight: 700;
    }

    /* =========================================================
       Records
       ========================================================= */

    .records-section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);

      overflow: hidden;
    }

    .records-toolbar {
      padding: 17px 18px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;

      border-bottom: 1px solid var(--border);
    }

    .search-box {
      width: min(420px, 100%);
      position: relative;
    }

    .search-box input {
      width: 100%;

      min-height: 42px;
      padding: 8px 14px 8px 40px;

      border: 1px solid var(--border);
      border-radius: 12px;

      outline: none;
      background: var(--bg-soft);
      color: var(--text);
    }

    .search-box input:focus {
      border-color: var(--primary-dark);
      box-shadow: 0 0 0 3px rgba(245, 215, 110, 0.25);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .record-count {
      color: var(--text-soft);
      font-size: 0.9rem;
      white-space: nowrap;
    }

    .table-scroll {
      width: 100%;
      overflow-x: auto;
    }

    .record-table {
      width: 100%;
      min-width: 720px;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .record-table th {
      background: var(--card-2);
      color: var(--brown);
      font-size: 0.88rem;
      font-weight: 900;

      padding: 13px 14px;
      text-align: left;

      white-space: nowrap;
    }

    .record-table td {
      padding: 13px 14px;
      border-top: 1px solid var(--border);

      vertical-align: middle;
    }

    /*
      重新調整欄位寬度：

      # 序號
      # 類別
      # 內容
      # 時間
      # 金額

      讓 TH 與 TD 完全使用相同 table layout。
    */

    .col-id {
      width: 9%;
    }

    .col-category {
      width: 15%;
    }

    .col-content {
      width: 32%;
    }

    .col-time {
      width: 23%;
    }

    .col-amount {
      width: 21%;
      text-align: right !important;
    }

    th.col-amount,
    td.col-amount {
      text-align: right;
    }

    .sort-button {
      display: inline-flex;
      align-items: center;
      gap: 5px;

      border: none;
      background: transparent;
      color: inherit;

      padding: 0;
      font-weight: 900;
    }

    .sort-button:hover {
      color: var(--orange);
    }

    .filter-wrapper {
      position: relative;
      display: inline-block;
      margin-left: 5px;
    }

    .filter-button {
      border: none;
      background: transparent;
      color: inherit;
      padding: 3px;
      font-size: 0.9rem;
    }

    .category-menu {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;

      z-index: 200;

      width: 180px;
      max-height: 260px;

      overflow-y: auto;
      overscroll-behavior: contain;

      padding: 7px;

      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;

      box-shadow: 0 12px 30px rgba(65, 45, 15, 0.18);

      display: none;
    }

    .category-menu.open {
      display: block;
    }

    .category-option {
      width: 100%;

      border: none;
      background: transparent;

      padding: 10px;
      text-align: left;

      color: var(--text);
      border-radius: 8px;
      font-weight: 700;
    }

    .category-option:hover,
    .category-option.active {
      background: var(--card-2);
    }

    /* =========================================================
       Category
       ========================================================= */

    .category-tag {
      display: inline-flex;
      align-items: center;

      padding: 4px 9px;
      border-radius: 999px;

      font-size: 0.78rem;
      font-weight: 900;

      white-space: nowrap;
    }

    .cat-餐飲 {
      background: #ffe0b2;
      color: #874a00;
    }

    .cat-交通 {
      background: #cce5ff;
      color: #16588c;
    }

    .cat-購物 {
      background: #ffd2df;
      color: #9a3055;
    }

    .cat-娛樂 {
      background: #ddd0ff;
      color: #6042a0;
    }

    .cat-房租 {
      background: #d9efc4;
      color: #3e7027;
    }

    .cat-醫療 {
      background: #ffcfcf;
      color: #a12c2c;
    }

    .cat-其他 {
      background: #ddd8cd;
      color: #625b4f;
    }

    /* =========================================================
       Time
       ========================================================= */

    .time-display {
      display: flex;
      flex-direction: column;
      gap: 2px;
      line-height: 1.2;
    }

    .time-date {
      font-weight: 800;
      color: var(--text);
      font-size: 0.9rem;
    }

    .time-clock {
      color: var(--text-soft);
      font-size: 0.78rem;
      font-weight: 700;
    }

    .amount {
      color: var(--orange);
      font-size: 1.03rem;
      font-weight: 950;
      white-space: nowrap;
    }

    .record-row {
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .record-row:hover {
      background: rgba(245, 215, 110, 0.13);
    }

    .row-actions {
      display: none;
      gap: 5px;
      margin-left: 7px;
    }

    .record-row:hover .row-actions {
      display: inline-flex;
    }

    .icon-button {
      width: 30px;
      height: 30px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border: 1px solid var(--border);
      border-radius: 8px;

      background: var(--card);
    }

    .icon-button.delete {
      color: var(--danger);
    }

    .empty-records {
      padding: 55px 20px;
      text-align: center;
      color: var(--text-soft);
      font-weight: 700;
    }

    /* =========================================================
       Modal
       ========================================================= */

    .modal-backdrop {
      position: fixed;
      inset: 0;

      z-index: 500;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 20px;

      background: rgba(28, 21, 12, 0.48);
      backdrop-filter: blur(5px);
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: min(560px, 100%);
      max-height: 90vh;

      overflow-y: auto;

      background: var(--card);
      color: var(--text);

      border: 1px solid var(--border);
      border-radius: 20px;

      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.25);

      animation: modalIn 0.18s ease;
    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .modal-header {
      padding: 18px 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      border-bottom: 1px solid var(--border);
    }

    .modal-title {
      font-size: 1.12rem;
      font-weight: 950;
    }

    .modal-close {
      width: 36px;
      height: 36px;

      border: none;
      border-radius: 50%;

      background: var(--card-2);
      color: var(--text);

      font-size: 1.2rem;
    }

    .modal-body {
      padding: 20px;
    }

    .detail-main {
      text-align: center;
      padding: 10px 0 20px;
    }

    .detail-amount {
      font-size: 2.4rem;
      font-weight: 950;
      color: var(--orange);
    }

    .detail-content {
      margin-top: 6px;
      font-size: 1.15rem;
      font-weight: 850;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .detail-item {
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px;
    }

    .detail-item.full {
      grid-column: 1 / -1;
    }

    .detail-label {
      color: var(--text-soft);
      font-size: 0.78rem;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .detail-value {
      font-weight: 800;
    }

    .modal-footer {
      padding: 15px 20px;

      display: flex;
      justify-content: flex-end;
      gap: 8px;

      border-top: 1px solid var(--border);
    }

    /* =========================================================
       Form
       ========================================================= */

    .form-group {
      margin-bottom: 15px;
    }

    .form-label {
      display: block;
      margin-bottom: 7px;
      font-weight: 850;
    }

    .form-control {
      width: 100%;

      min-height: 45px;

      border: 1px solid var(--border);
      border-radius: 11px;

      padding: 9px 12px;

      outline: none;

      background: var(--bg-soft);
      color: var(--text);
    }

    .form-control:focus {
      border-color: var(--primary-dark);
      box-shadow: 0 0 0 3px rgba(245, 215, 110, 0.25);
    }

    .amount-row {
      display: flex;
      gap: 8px;
    }

    .amount-row input {
      flex: 1;
      min-width: 0;
    }

    .quick-add {
      display: flex;
      gap: 6px;
    }

    .quick-add button {
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--brown);

      border-radius: 9px;
      padding: 7px 9px;

      font-weight: 850;
      white-space: nowrap;
    }

    .location-row {
      display: flex;
      gap: 8px;
    }

    .location-row input {
      flex: 1;
      min-width: 0;
    }

    /* =========================================================
       Toast
       ========================================================= */

    .toast-container {
      position: fixed;
      top: 84px;
      left: 50%;
      transform: translateX(-50%);

      z-index: 1000;

      display: flex;
      flex-direction: column;
      gap: 8px;

      pointer-events: none;
    }

    .toast {
      min-width: 220px;
      max-width: 90vw;

      padding: 12px 17px;

      border-radius: 12px;

      background: var(--brown);
      color: white;

      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);

      text-align: center;
      font-weight: 800;

      animation:
        toastIn 0.2s ease,
        toastOut 0.25s ease 1.75s forwards;
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateY(-7px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes toastOut {
      to {
        opacity: 0;
        transform: translateY(-7px);
      }
    }

    /* =========================================================
       Data menu
       ========================================================= */

    .data-menu-wrapper {
      position: relative;
    }

    .data-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;

      width: 190px;

      display: none;

      padding: 7px;

      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 13px;

      box-shadow: 0 12px 30px rgba(65, 45, 15, 0.18);

      z-index: 300;
    }

    .data-menu.open {
      display: block;
    }

    .data-menu button {
      width: 100%;

      padding: 10px;

      border: none;
      background: transparent;

      color: var(--text);
      text-align: left;

      border-radius: 8px;
      font-weight: 750;
    }

    .data-menu button:hover {
      background: var(--card-2);
    }

    .data-menu button.danger-item {
      color: var(--danger);
    }

    /* =========================================================
       Mobile
       ========================================================= */

    @media (max-width: 900px) {
      .topbar {
        padding: 10px 16px;
      }

      main {
        padding: 17px 16px 30px;
      }

      .font-control span {
        display: none;
      }

      .dashboard {
        gap: 12px;
      }
    }

    @media (max-width: 600px) {
      html {
        font-size: max(var(--font-size), 17px);
      }

      body {
        overflow-x: hidden;
      }

      .topbar {
        min-height: 62px;
        padding: 8px 11px;

        gap: 7px;
      }

      .brand-area {
        gap: 5px;
        flex: 1;
        min-width: 0;
      }

      .brand {
        font-size: 1rem;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .header-actions {
        gap: 5px;
      }

      .desktop-only {
        display: none !important;
      }

      .mobile-menu {
        display: block;
      }

      .btn {
        min-height: 43px;
        padding: 8px 11px;
      }

      .header-actions .btn-primary {
        width: 43px;
        padding: 0;
        font-size: 1.25rem;
      }

      main {
        padding: 12px 10px 25px;
      }

      /*
        手機版統計資料垂直排列
      */

      .dashboard {
        min-height: auto;

        grid-template-columns: 1fr;

        margin-bottom: 12px;
      }

      .stat-card {
        min-height: 125px;
        padding: 19px 20px;
      }

      .stat-number {
        font-size: 2.15rem;
      }

      .filter-bar {
        grid-column: 1;
        padding-bottom: 3px;
      }

      .filter-btn {
        min-height: 43px;
        padding: 8px 13px;
      }

      .chart-section {
        padding: 13px;
        margin-bottom: 12px;
        min-height: 250px;
      }

      .chart-wrapper {
        height: 220px;
      }

      .records-toolbar {
        padding: 11px;

        align-items: center;
      }

      .search-box {
        width: 65%;
      }

      .search-box input {
        min-height: 43px;
        padding-left: 37px;
      }

      .record-count {
        font-size: 0.78rem;
      }

      /*
        清單保持水平表格。
        使用者可以左右拖動。
      */

      .table-scroll {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      .record-table {
        min-width: 680px;
      }

      .record-table th,
      .record-table td {
        padding: 12px 9px;
      }

      .col-id {
        width: 10%;
      }

      .col-category {
        width: 17%;
      }

      .col-content {
        width: 31%;
      }

      .col-time {
        width: 22%;
      }

      .col-amount {
        width: 20%;
      }

      /*
        手機不使用左滑刪除功能
      */

      .row-actions {
        display: none !important;
      }

      .detail-grid {
        grid-template-columns: 1fr;
      }

      .detail-item.full {
        grid-column: auto;
      }

      .modal-backdrop {
        padding: 10px;
        align-items: flex-end;
      }

      .modal {
        max-height: 88vh;

<!-- =========================================================

<script type="module">

  /* =========================================================
     Firebase SDK
     ========================================================= */

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signOut,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  import {
    getFirestore,
    collection,
    doc,
    setDoc,
    deleteDoc,
    getDocs
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  /* =========================================================
     Firebase 設定
     
     這裡使用你提供的 Firebase Configuration。
     
     注意：
     Firebase Web API Key 本身不是 Firebase 資料庫密碼。
     真正控制資料安全的是 Firestore Rules + Authentication。
     ========================================================= */

  const firebaseConfig = {
    apiKey: "AIzaSyAY2G2UObkOr-jnSI7ZfO4jsQb2ZSScOSoI",
    authDomain: "accounting-system-b42ba.firebaseapp.com",
    projectId: "accounting-system-b42ba",
    storageBucket: "accounting-system-b42ba.firebasestorage.app",
    messagingSenderId: "112901288885",
    appId: "1:112901288885:web:350f90297018165d941ffc",
    measurementId: "G-XSP0NTY9ED"
  };


  /* =========================================================
     初始化 Firebase
     ========================================================= */

  const firebaseApp = initializeApp(firebaseConfig);

  const auth = getAuth(firebaseApp);

  const db = getFirestore(firebaseApp);

  const googleProvider = new GoogleAuthProvider();


  /* =========================================================
     你的 Firestore Rules 對應

     match /users/{userId}/{document=**} {

       allow read, write:
         if request.auth != null
         && request.auth.uid == userId;

     }

     因此資料必須放在：

     users
       └── UID
            └── accountingRecords
                 └── recordId

     這樣登入者只能看到自己的資料。
     ========================================================= */


  /* =========================================================
     常數
     ========================================================= */

  const STORAGE_KEY = "accountingRecords";

  const CATEGORIES = [
    "餐飲",
    "交通",
    "購物",
    "娛樂",
    "房租",
    "醫療",
    "其他"
  ];


  /* =========================================================
     State
     ========================================================= */

  let records = [];

  let currentUser = null;

  let selectedRecordId = null;

  let editingRecordId = null;

  let activePeriod = "all";

  let activeCategory = "all";

  let searchKeyword = "";

  let sortField = "id";

  let sortDirection = "desc";

  let categoryChart = null;


  /* =========================================================
     DOM
     ========================================================= */

  const $ = (id) => document.getElementById(id);


  /* =========================================================
     基本工具
     ========================================================= */

  function showToast(message) {

    const toast = document.createElement("div");

    toast.className = "toast";

    toast.textContent = message;

    $("toastContainer").appendChild(toast);

    setTimeout(() => {

      toast.remove();

    }, 2000);
  }


  function escapeHtml(value) {

    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  function getNowLocalInputValue() {

    const now = new Date();

    const offset =
      now.getTimezoneOffset() * 60000;

    return new Date(
      now.getTime() - offset
    )
      .toISOString()
      .slice(0, 16);

  }


  function parseDate(value) {

    if (!value) {
      return null;
    }

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
      return null;
    }

    return date;

  }


  function formatDateTime(value) {

    const date = parseDate(value);

    if (!date) {
      return {
        date: "-",
        time: "-"
      };
    }

    const year = date.getFullYear();

    const month = String(
      date.getMonth() + 1
    ).padStart(2, "0");

    const day = String(
      date.getDate()
    ).padStart(2, "0");

    const hour = String(
      date.getHours()
    ).padStart(2, "0");

    const minute = String(
      date.getMinutes()
    ).padStart(2, "0");

    return {
      date: `${year}/${month}/${day}`,
      time: `${hour}:${minute}`
    };

  }


  function formatMoney(value) {

    const number =
      Number(value) || 0;

    return number.toLocaleString(
      "zh-TW",
      {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      }
    );

  }


  function generateId() {

    if (!records.length) {
      return 1;
    }

    return Math.max(
      ...records.map(
        r => Number(r.id) || 0
      )
    ) + 1;

  }


  /* =========================================================
     LocalStorage
     ========================================================= */

  function loadLocalRecords() {

    try {

      const saved =
        localStorage.getItem(
          STORAGE_KEY
        );

      if (!saved) {
        return [];
      }

      const parsed =
        JSON.parse(saved);

      if (!Array.isArray(parsed)) {
        return [];
      }

      return parsed.map(normalizeRecord);

    } catch (error) {

      console.error(
        "LocalStorage 讀取失敗",
        error
      );

      return [];

    }

  }


  function saveLocalRecords() {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(records)
    );

  }


  function normalizeRecord(record) {

    return {
      id: Number(record.id) || 0,

      amount:
        Number(record.amount) || 0,

      content:
        String(record.content || ""),

      time:
        record.time || "",

      location:
        String(record.location || ""),

      category:
        CATEGORIES.includes(record.category)
          ? record.category
          : "其他"
    };

  }


  /* =========================================================
     Firebase 讀取
     ========================================================= */

  async function loadFirebaseRecords() {

    if (!currentUser) {
      return;
    }

    try {

      const recordsRef =
        collection(
          db,
          "users",
          currentUser.uid,
          "accountingRecords"
        );

      const snapshot =
        await getDocs(recordsRef);

      const firebaseRecords = [];

      snapshot.forEach(
        docSnapshot => {

          firebaseRecords.push(
            normalizeRecord(
              docSnapshot.data()
            )
          );

        }
      );

      /*
        Firebase 有資料：
        以 Firebase 為目前登入帳號的主要資料來源。

        同時寫入 LocalStorage，
        方便離線 / 未登入狀態使用。
      */

      records = firebaseRecords;

      saveLocalRecords();

      renderAll();

    } catch (error) {

      console.error(
        "Firebase 讀取失敗：",
        error
      );

      showToast(
        "Firebase 讀取失敗，暫時使用本機資料"
      );

    }

  }


  /* =========================================================
     Firebase 儲存單筆
     ========================================================= */

  async function saveRecordToFirebase(record) {

    if (!currentUser) {
      return;
    }

    const recordRef =
      doc(
        db,
        "users",
        currentUser.uid,
        "accountingRecords",
        String(record.id)
      );

    await setDoc(
      recordRef,
      record
    );

  }


  /* =========================================================
     Firebase 刪除單筆
     ========================================================= */

  async function deleteRecordFromFirebase(id) {

    if (!currentUser) {
      return;
    }

    await deleteDoc(
      doc(
        db,
        "users",
        currentUser.uid,
        "accountingRecords",
        String(id)
      )
    );

  }


  /* =========================================================
     Google Login
     ========================================================= */

  async function loginWithGoogle() {

    try {

      await signInWithPopup(
        auth,
        googleProvider
      );

    } catch (error) {

      console.error(
        "Google 登入失敗：",
        error
      );

      if (
        error.code ===
        "auth/popup-blocked"
      ) {

        showToast(
          "Google 登入視窗被瀏覽器阻擋"
        );

      } else if (
        error.code ===
        "auth/popup-closed-by-user"
      ) {

        showToast(
          "登入視窗已關閉"
        );

      } else {

        showToast(
          "Google 登入失敗，請檢查 Firebase 設定"
        );

      }

    }

  }


  async function logoutGoogle() {

    try {

      await signOut(auth);

      showToast("已登出");

    } catch (error) {

      console.error(error);

      showToast("登出失敗");

    }

  }


  /* =========================================================
     Firebase Auth 狀態
     ========================================================= */

  onAuthStateChanged(
    auth,
    async user => {

      currentUser = user;

      if (user) {

        $("loginBtn").textContent =
          "登出";

        $("loginBtn").title =
          `${user.displayName || ""} 已登入`;

        await loadFirebaseRecords();

      } else {

        $("loginBtn").textContent =
          "登入";

        $("loginBtn").title =
          "使用 Google 登入";

        records =
          loadLocalRecords();

        renderAll();

      }

    }
  );


  /* =========================================================
     日期篩選
     ========================================================= */

  function isSameDay(a, b) {

    return (
      a.getFullYear() === b.getFullYear() &&
      a.getMonth() === b.getMonth() &&
      a.getDate() === b.getDate()
    );

  }


  function isThisWeek(date) {

    const now = new Date();

    const day =
      now.getDay();

    const diff =
      day === 0
        ? 6
        : day - 1;

    const monday =
      new Date(now);

    monday.setHours(
      0, 0, 0, 0
    );

    monday.setDate(
      now.getDate() - diff
    );

    const nextMonday =
      new Date(monday);

    nextMonday.setDate(
      monday.getDate() + 7
    );

    return (
      date >= monday &&
      date < nextMonday
    );

  }


  function isThisMonth(date) {

    const now = new Date();

    return (
      date.getFullYear() ===
        now.getFullYear() &&
      date.getMonth() ===
        now.getMonth()
    );

  }


  function recordPassesPeriod(record) {

    if (activePeriod === "all") {
      return true;
    }

    const date =
      parseDate(record.time);

    if (!date) {
      return false;
    }

    if (activePeriod === "today") {
      return isSameDay(
        date,
        new Date()
      );
    }

    if (activePeriod === "week") {
      return isThisWeek(date);
    }

    if (activePeriod === "month") {
      return isThisMonth(date);
    }

    return true;

  }


  /* =========================================================
     Filtering
     ========================================================= */

  function getFilteredRecords() {

    let result =
      records.filter(
        record =>
          recordPassesPeriod(record)
      );

    if (activeCategory !== "all") {

      result =
        result.filter(
          record =>
            record.category ===
            activeCategory
        );

    }

    if (searchKeyword.trim()) {

      const keyword =
        searchKeyword
          .trim()
          .toLowerCase();

      result =
        result.filter(record => {

          return (
            String(record.content)
              .toLowerCase()
              .includes(keyword) ||

            String(record.location)
              .toLowerCase()
              .includes(keyword)
          );

        });

    }

    result.sort(
      (a, b) => {

        let valueA;
        let valueB;

        if (sortField === "id") {

          valueA =
            Number(a.id);

          valueB =
            Number(b.id);

        } else if (
          sortField === "amount"
        ) {

          valueA =
            Number(a.amount);

          valueB =
            Number(b.amount);

        } else if (
          sortField === "content"
        ) {

          valueA =
            String(a.content)
              .localeCompare(
                String(b.content),
                "zh-Hant"
              );

          valueB = 0;

        }

        if (
          sortField === "content"
        ) {

          return sortDirection === "asc"
            ? valueA
            : -valueA;

        }

        return sortDirection === "asc"
          ? valueA - valueB
          : valueB - valueA;

      }
    );

    return result;

  }

  /* =========================================================
     Chart
     ========================================================= */

  function renderChart() {

    const filtered =
      getFilteredRecords();

    const canvas =
      $("categoryChart");

    const empty =
      $("emptyChart");

    if (
      categoryChart
    ) {

      categoryChart.destroy();

      categoryChart = null;

    }

    if (!filtered.length) {

      canvas.style.display =
        "none";

      empty.style.display =
        "flex";

      return;

    }

    canvas.style.display =
      "block";

    empty.style.display =
      "none";

    const categoryTotals =
      {};

    CATEGORIES.forEach(
      category => {
        categoryTotals[category] = 0;
      }
    );

    filtered.forEach(
      record => {

        const category =
          CATEGORIES.includes(
            record.category
          )
            ? record.category
            : "其他";

        categoryTotals[category] +=
          Number(record.amount) || 0;

      }
    );

    const labels =
      CATEGORIES.filter(
        category =>
          categoryTotals[category] > 0
      );

    const values =
      labels.map(
        category =>
          categoryTotals[category]
      );

    categoryChart =
      new Chart(
        canvas,
        {
          type: "pie",

          data: {
            labels,

            datasets: [
              {
                data: values,

                borderWidth: 2,

                borderColor:
                  getComputedStyle(
                    document.body
                  ).getPropertyValue(
                    "--card"
                  )
              }
            ]
          },

          options: {
            responsive: true,

            maintainAspectRatio: false,

            plugins: {
              legend: {
                position: "right",

                labels: {
                  color:
                    getComputedStyle(
                      document.body
                    ).getPropertyValue(
                      "--text"
                    )
                }
              },

              tooltip: {
                callbacks: {
                  label: context => {

                    const total =
                      values.reduce(
                        (a, b) => a + b,
                        0
                      );

                    const value =
                      Number(
                        context.raw
                      );

                    const percent =
                      total
                        ? (
                            value /
                            total *
                            100
                          ).toFixed(1)
                        : 0;

                    return `${context.label}: NT$ ${formatMoney(value)} (${percent}%)`;

                  }
                }
              }
            }
          }
        }
      );

  }

  /* =========================================================

     ========================================================= */

  $("recordForm")
    .addEventListener(
      "submit",
      async event => {

        event.preventDefault();

        const amount =
          Number(
            $("amountInput").value
          );

        const content =
          $("contentInput").value.trim();

        const time =
          $("timeInput").value;

        const location =
          $("locationInput").value.trim();

        const category =
          $("categoryInput").value;

        if (
          !Number.isFinite(amount) ||
          amount < 0
        ) {

          showToast(
            "請輸入有效的消費金額"
          );

          return;

        }

        if (!content) {

          showToast(
            "請輸入消費內容"
          );

          return;

        }

        if (!time) {

          showToast(
            "請選擇消費時間"
          );

          return;

        }

        const record = {
          id:
            editingRecordId ??
            generateId(),

          amount:
            Number(
              amount.toFixed(2)
            ),

          content,

          time,

          location,

          category
        };

        try {

          if (
            editingRecordId !== null
          ) {

            const index =
              records.findIndex(
                r =>
                  Number(r.id) ===
                  Number(editingRecordId)
              );

            if (index !== -1) {

              records[index] =
                record;

            }

            saveLocalRecords();

            await saveRecordToFirebase(
              record
            );

            showToast(
              "記錄已更新"
            );

          } else {

            records.push(
              record
            );

            saveLocalRecords();

            await saveRecordToFirebase(
              record
            );

            showToast(
              "新增記錄成功"
            );

          }

          closeModal(
            "formModal"
          );

          renderAll();

        } catch (error) {

          console.error(error);

          /*
            即使 Firebase 暫時失敗，
            LocalStorage 已經先保存，
            因此不讓使用者的資料消失。
          */

          saveLocalRecords();

          renderAll();

          showToast(
            "本機已保存，但 Firebase 同步失敗"
          );

        }

      }
    );


  /* =========================================================
     Delete
     ========================================================= */

  async function deleteRecord(id) {

    const record =
      records.find(
        r =>
          Number(r.id) ===
          Number(id)
      );

    if (!record) {
      return;
    }

    const confirmed =
      confirm(
        `確認刪除？\n\n#${record.id} ${record.content}\nNT$ ${formatMoney(record.amount)}`
      );

    if (!confirmed) {
      return;
    }

    try {

      records =
        records.filter(
          r =>
            Number(r.id) !==
            Number(id)
        );

      saveLocalRecords();

      await deleteRecordFromFirebase(
        id
      );

      closeModal(
        "detailModal"
      );

      renderAll();

      showToast(
        "刪除成功"
      );

    } catch (error) {

      console.error(error);

      /*
        如果 Firebase 刪除失敗，
        重新從本機狀態保存。
      */

      saveLocalRecords();

      renderAll();

      showToast(
        "本機已刪除，但 Firebase 同步失敗"
      );

    }

  }

  /* =========================================================
     CSV Export

     Excel 標題欄固定為：

     消費序號
     消費內容
     消費金額
     消費時間

     同時附上地點與類別。
     ========================================================= */

  function exportCSV() {

    const headers = [
      "消費序號",
      "消費內容",
      "消費金額",
      "消費時間",
      "消費地點",
      "消費類別"
    ];

    const rows =
      records.map(
        record => [
          record.id,
          record.content,
          record.amount,
          record.time,
          record.location,
          record.category
        ]
      );

    const csvRows = [
      headers,
      ...rows
    ];

    const csv =
      "\uFEFF" +
      csvRows
        .map(
          row =>
            row
              .map(
                value =>
                  `"${String(
                    value ?? ""
                  ).replaceAll(
                    '"',
                    '""'
                  )}"`
              )
              .join(",")
        )
        .join("\r\n");

    const blob =
      new Blob(
        [csv],
        {
          type:
            "text/csv;charset=utf-8;"
        }
      );

    const url =
      URL.createObjectURL(
        blob
      );

    const a =
      document.createElement(
        "a"
      );

    const date =
      new Date()
        .toISOString()
        .slice(0, 10);

    a.href = url;

    a.download =
      `accountingRecords_${date}.csv`;

    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(url);

    showToast(
      "CSV 匯出成功"
    );

  }


  $("exportBtn")
    .addEventListener(
      "click",
      () => {

        exportCSV();

        $("dataMenu")
          .classList.remove(
            "open"
          );

      }
    );


  /* =========================================================
     Import
     ========================================================= */

  $("importBtn")
    .addEventListener(
      "click",
      () => {

        $("fileInput").click();

        $("dataMenu")
          .classList.remove(
            "open"
          );

      }
    );


  $("fileInput")
    .addEventListener(
      "change",
      async event => {

        const file =
          event.target.files[0];

        if (!file) {
          return;
        }

        try {

          const text =
            await file.text();

          let imported = [];

          if (
            file.name
              .toLowerCase()
              .endsWith(".json")
          ) {

            const parsed =
              JSON.parse(text);

            imported =
              Array.isArray(parsed)
                ? parsed
                : parsed.records || [];

          } else {

            imported =
              parseCSV(text);

          }

          imported =
            imported
              .map(normalizeRecord)
              .filter(
                record =>
                  record.content
              );

          if (!imported.length) {

            showToast(
              "找不到有效資料"
            );

            return;

          }

          const confirmed =
            confirm(
              `即將匯入 ${imported.length} 筆資料。\n\n匯入後會與目前資料合併，是否繼續？`
            );

          if (!confirmed) {
            return;
          }

          const existingIds =
            new Set(
              records.map(
                r =>
                  Number(r.id)
              )
            );

          imported.forEach(
            record => {

              if (
                existingIds.has(
                  Number(record.id)
                )
              ) {

                record.id =
                  generateId();

              }

              records.push(
                record
              );

            }
          );

          saveLocalRecords();

          /*
            登入 Firebase 時，
            將匯入資料同步上傳。
          */

          if (currentUser) {

            for (
              const record of imported
            ) {

              await saveRecordToFirebase(
                record
              );

            }

          }

          renderAll();

          showToast(
            `成功匯入 ${imported.length} 筆資料`
          );

        } catch (error) {

          console.error(error);

          showToast(
            "匯入失敗，請確認檔案格式"
          );

        }

        event.target.value = "";

      }
    );


  /* =========================================================
     CSV Parser
     ========================================================= */

  function parseCSV(text) {

    const lines = [];
    let row = [];
    let cell = "";
    let insideQuotes = false;

    for (
      let i = 0;
      i < text.length;
      i++
    ) {

      const char =
        text[i];

      const next =
        text[i + 1];

      if (
        char === '"' &&
        insideQuotes &&
        next === '"'
      ) {

        cell += '"';

        i++;

        continue;

      }

      if (
        char === '"'
      ) {

        insideQuotes =
          !insideQuotes;

        continue;

      }

      if (
        char === "," &&
        !insideQuotes
      ) {

        row.push(cell);

        cell = "";

        continue;

      }

      if (
        (
          char === "\n" ||
          char === "\r"
        ) &&
        !insideQuotes
      ) {

        if (
          char === "\r" &&
          next === "\n"
        ) {

          i++;

        }

        row.push(cell);

        cell = "";

        if (
          row.some(
            value =>
              value.trim() !== ""
          )
        ) {

          lines.push(row);

        }

        row = [];

        continue;

      }

      cell += char;

    }

    row.push(cell);

    if (
      row.some(
        value =>
          value.trim() !== ""
      )
    ) {

      lines.push(row);

    }

    if (lines.length < 2) {
      return [];
    }

    /*
      支援兩種標題：

      消費序號 / 消費內容 / 消費金額 / 消費時間

      以及本系統完整 CSV
    */

    const headers =
      lines[0].map(
        h =>
          h.trim()
            .replace(
              /^\uFEFF/,
              ""
            )
      );

    const indexOf =
      (...names) => {

        for (
          const name of names
        ) {

          const index =
            headers.indexOf(
              name
            );

          if (index !== -1) {
            return index;
          }

        }

        return -1;

      };

    const idIndex =
      indexOf(
        "消費序號",
        "id"
      );

    const contentIndex =
      indexOf(
        "消費內容",
        "content"
      );

    const amountIndex =
      indexOf(
        "消費金額",
        "amount"
      );

    const timeIndex =
      indexOf(
        "消費時間",
        "time"
      );

    const locationIndex =
      indexOf(
        "消費地點",
        "location"
      );

    const categoryIndex =
      indexOf(
        "消費類別",
        "category"
      );

    return lines
      .slice(1)
      .map(
        values => ({
          id:
            idIndex >= 0
              ? Number(
                  values[idIndex]
                )
              : 0,

          content:
            contentIndex >= 0
              ? values[contentIndex]
              : "",

          amount:
            amountIndex >= 0
              ? Number(
                  values[amountIndex]
                )
              : 0,

          time:
            timeIndex >= 0
              ? values[timeIndex]
              : "",

          location:
            locationIndex >= 0
              ? values[locationIndex]
              : "",

          category:
            categoryIndex >= 0
              ? values[categoryIndex]
              : "其他"
        })
      );

  }


  /* =========================================================
     Clear All

     雙重確認。
     ========================================================= */

  $("clearAllBtn")
    .addEventListener(
      "click",
      async () => {

        const first =
          confirm(
            "⚠️ 確定要刪除全部消費記錄嗎？\n\n這個操作無法復原。"
          );

        if (!first) {
          return;
        }

        const second =
          confirm(
            "最後確認：真的要「全部刪除」嗎？"
          );

        if (!second) {
          return;
        }

        try {

          /*
            Firebase：
            由於你的 Rules 允許目前登入者
            讀寫自己的 users/{uid}/*，
            這裡逐筆刪除。
          */

          if (currentUser) {

            const recordsRef =
              collection(
                db,
                "users",
                currentUser.uid,
                "accountingRecords"
              );

            const snapshot =
              await getDocs(
                recordsRef
              );

            for (
              const item of snapshot.docs
            ) {

              await deleteDoc(
                item.ref
              );

            }

          }

          records = [];

          localStorage.removeItem(
            STORAGE_KEY
          );

          renderAll();

          $("dataMenu")
            .classList.remove(
              "open"
            );

          showToast(
            "所有記錄已清除"
          );

        } catch (error) {

          console.error(error);

          /*
            Firebase 清除失敗時，
            不偷偷假裝已同步成功。
          */

          showToast(
            "Firebase 清除失敗，請檢查登入狀態"
          );

        }

      }
    );


  /* =========================================================
     Initial
     ========================================================= */

  loadTheme();

  records =
    loadLocalRecords();

  renderAll();


</script>
