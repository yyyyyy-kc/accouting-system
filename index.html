<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f7df8a">
<title>💰 我的記帳本</title>

<!-- Chart.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root {
    --bg: #fff9df;
    --surface: #fffdf2;
    --surface2: #fff3b8;
    --border: #ead99a;
    --text: #4d351f;
    --muted: #8b765d;
    --primary: #d88b28;
    --primary-dark: #9b5a18;
    --accent: #f5d76e;
    --danger: #c94b3c;
    --success: #4c8048;
    --shadow: 0 8px 25px rgba(110, 75, 25, .10);
    --font-size: 16px;
}

[data-theme="dark"] {
    --bg: #292318;
    --surface: #332b1d;
    --surface2: #443820;
    --border: #655432;
    --text: #fff4ce;
    --muted: #c5b58c;
    --primary: #e5a447;
    --primary-dark: #ffc36b;
    --accent: #765d26;
    --danger: #ef7667;
    --success: #87bb75;
    --shadow: 0 8px 25px rgba(0,0,0,.3);
}

* {
    box-sizing: border-box;
}

html {
    font-size: var(--font-size);
}

body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
    transition: background .25s, color .25s;
}

button,
input,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto auto 1fr;
}

/* =========================
   Header
========================= */

.header {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    padding: 14px 22px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 2px 12px rgba(0,0,0,.05);
}

.brand-area {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
}

.brand {
    font-size: 1.35rem;
    font-weight: 900;
    white-space: nowrap;
}

.auth-btn {
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    border-radius: 999px;
    padding: 7px 13px;
    font-weight: 800;
    max-width: 260px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.auth-btn.logged {
    color: var(--success);
}

.header-actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    flex-wrap: wrap;
}

.header-btn {
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 10px;
    font-weight: 800;
}

.header-btn:hover {
    background: var(--accent);
}

.add-btn {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
    font-size: 1.15rem;
    min-width: 46px;
    height: 42px;
}

.font-control {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px 9px;
}

.font-control input {
    width: 85px;
}

.data-menu {
    position: relative;
}

.data-menu-panel {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    min-width: 170px;
    display: none;
    padding: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
}

.data-menu.open .data-menu-panel {
    display: block;
}

.data-menu-panel button {
    display: block;
    width: 100%;
    text-align: left;
    border: 0;
    background: transparent;
    color: var(--text);
    padding: 10px;
    border-radius: 8px;
}

.data-menu-panel button:hover {
    background: var(--surface2);
}

/* =========================
   Dashboard
========================= */

.dashboard {
    padding: 18px 22px 14px;
    min-height: 25vh;
}

.stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
}

.stat-card {
    min-height: 135px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 22px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: var(--shadow);
}

.stat-title {
    color: var(--muted);
    font-weight: 800;
}

.stat-number {
    margin-top: 7px;
    color: var(--primary-dark);
    font-size: clamp(2rem, 4vw, 3.5rem);
    font-weight: 950;
}

.filters {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
    flex-wrap: wrap;
}

.filter-btn {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 999px;
    padding: 8px 13px;
    font-weight: 750;
}

.filter-btn.active {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
}

.chart-section {
    margin-top: 15px;
    height: 210px;
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 10px;
}

.no-chart {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-weight: 800;
}

/* =========================
   Records
========================= */

.records-section {
    min-height: 0;
    padding: 8px 22px 25px;
}

.records-card {
    height: 100%;
    min-height: 350px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: var(--shadow);
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

.records-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px;
    border-bottom: 1px solid var(--border);
}

.search-box {
    width: min(500px, 100%);
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    padding: 11px 14px;
    border-radius: 11px;
    outline: none;
}

.search-box:focus {
    border-color: var(--primary);
}

.records-count {
    color: var(--muted);
    white-space: nowrap;
}

.table-wrap {
    flex: 1;
    overflow-x: auto;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
}

.table {
    min-width: 850px;
}

.table-header,
.record-row {
    display: grid;
    /*
       這組欄寬是表頭與資料列共用，
       確保「金額」與「序號」絕對對齊。
    */
    grid-template-columns:
        150px
        130px
        minmax(260px, 1fr)
        100px
        90px;
    align-items: center;
}

.table-header {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--surface2);
    border-bottom: 2px solid var(--border);
    font-weight: 900;
}

.th,
.td {
    padding: 12px 14px;
}

.th {
    position: relative;
    user-select: none;
}

.sort-btn {
    border: 0;
    background: transparent;
    color: var(--text);
    font-weight: 900;
    padding: 0;
}

.sort-btn:hover {
    color: var(--primary-dark);
}

.filter-category {
    display: inline-flex;
    position: relative;
    margin-left: 4px;
}

.funnel-btn {
    border: 0;
    background: transparent;
    padding: 3px;
    font-size: .9rem;
}

.category-menu {
    position: absolute;
    z-index: 50;
    top: calc(100% + 7px);
    left: 0;
    width: 190px;
    max-height: 230px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 7px;
    display: none;
}

.category-menu.open {
    display: block;
}

.category-option {
    width: 100%;
    border: 0;
    background: transparent;
    color: var(--text);
    text-align: left;
    padding: 10px;
    border-radius: 8px;
}

.category-option:hover,
.category-option.active {
    background: var(--surface2);
}

.record-row {
    position: relative;
    min-height: 63px;
    border-bottom: 1px solid var(--border);
    transition: background .15s, transform .2s;
    touch-action: pan-y;
}

.record-row:hover {
    background: var(--surface2);
}

.amount {
    font-weight: 950;
    color: var(--primary-dark);
}

.category-tag {
    display: inline-block;
    padding: 4px 9px;
    border-radius: 999px;
    font-size: .78rem;
    font-weight: 900;
}

.cat-餐飲 { background: #ffe0b2; color: #8b4c00; }
.cat-交通 { background: #cce5ff; color: #15558a; }
.cat-購物 { background: #f3d0ff; color: #733d86; }
.cat-娛樂 { background: #ffd1d1; color: #913c3c; }
.cat-房租 { background: #d8efc9; color: #427238; }
.cat-醫療 { background: #c8f0e8; color: #23695e; }
.cat-其他 { background: #dedede; color: #555; }

.row-actions {
    display: flex;
    gap: 4px;
    opacity: 0;
    transition: opacity .15s;
}

.record-row:hover .row-actions {
    opacity: 1;
}

.icon-btn {
    border: 0;
    background: var(--surface2);
    color: var(--text);
    width: 34px;
    height: 34px;
    border-radius: 8px;
}

.delete-icon {
    color: var(--danger);
}

.mobile-delete {
    display: none;
    position: absolute;
    right: 0;
    top: 0;
    bottom: 0;
    width: 78px;
    border: 0;
    background: var(--danger);
    color: white;
    font-weight: 900;
}

/* =========================
   Modal
========================= */

.modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 500;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 18px;
    background: rgba(0,0,0,.45);
}

.modal-backdrop.show {
    display: flex;
}

.modal {
    width: min(560px, 100%);
    max-height: 90vh;
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: 0 20px 70px rgba(0,0,0,.25);
}

.modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
}

.modal-title {
    margin: 0;
    font-size: 1.25rem;
}

.close-btn {
    border: 0;
    background: transparent;
    color: var(--muted);
    font-size: 1.5rem;
}

.modal-body {
    padding: 20px;
}

.detail-grid {
    display: grid;
    gap: 14px;
}

.detail-item {
    padding: 13px;
    background: var(--surface2);
    border-radius: 11px;
}

.detail-label {
    color: var(--muted);
    font-size: .85rem;
    font-weight: 800;
}

.detail-value {
    margin-top: 4px;
    font-weight: 800;
    word-break: break-word;
}

.form-group {
    margin-bottom: 15px;
}

.form-label {
    display: block;
    margin-bottom: 7px;
    font-weight: 900;
}

.form-control {
    width: 100%;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    padding: 11px 12px;
    border-radius: 10px;
    outline: none;
}

.form-control:focus {
    border-color: var(--primary);
}

.amount-tools {
    display: flex;
    gap: 7px;
    margin-top: 8px;
    flex-wrap: wrap;
}

.quick-add {
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    padding: 7px 10px;
    border-radius: 8px;
    font-weight: 800;
}

.location-line {
    display: flex;
    gap: 7px;
}

.location-line .form-control {
    flex: 1;
}

.map-btn {
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    border-radius: 10px;
    padding: 0 13px;
    font-weight: 800;
}

.modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 9px;
    padding: 15px 20px;
    border-top: 1px solid var(--border);
}

.primary-btn,
.secondary-btn,
.danger-btn {
    border: 0;
    border-radius: 10px;
    padding: 10px 16px;
    font-weight: 900;
}

.primary-btn {
    background: var(--primary);
    color: white;
}

.secondary-btn {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
}

.danger-btn {
    background: var(--danger);
    color: white;
}

/* =========================
   Toast
========================= */

.toast-container {
    position: fixed;
    z-index: 1000;
    top: 75px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
}

.toast {
    background: #51371e;
    color: white;
    padding: 11px 17px;
    border-radius: 999px;
    box-shadow: var(--shadow);
    animation: toastIn .2s ease, toastOut .3s ease 1.7s forwards;
}

@keyframes toastIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes toastOut {
    to { opacity: 0; transform: translateY(-10px); }
}

/* =========================
   Empty
========================= */

.empty {
    padding: 60px 20px;
    text-align: center;
    color: var(--muted);
    font-weight: 800;
}

/* =========================
   Mobile
========================= */

@media (max-width: 600px) {

    html {
        font-size: max(var(--font-size), 17px);
    }

    .header {
        padding: 12px;
        align-items: flex-start;
        flex-direction: column;
    }

    .brand-area {
        width: 100%;
        justify-content: space-between;
    }

    .brand {
        font-size: 1.2rem;
    }

    .auth-btn {
        max-width: 180px;
        padding: 9px 11px;
    }

    .header-actions {
        width: 100%;
        justify-content: space-between;
    }

    .font-control {
        flex: 1;
    }

    .font-control input {
        width: 100%;
    }

    .header-btn {
        min-height: 44px;
        padding: 9px 12px;
    }

    .add-btn {
        min-width: 52px;
        height: 46px;
    }

    .dashboard {
        padding: 12px;
    }

    .stats {
        grid-template-columns: 1fr;
        gap: 10px;
    }

    .stat-card {
        min-height: 105px;
        padding: 17px;
    }

    .stat-number {
        font-size: 2.2rem;
    }

    .filters {
        overflow-x: auto;
        flex-wrap: nowrap;
        padding-bottom: 3px;
    }

    .filter-btn {
        flex: 0 0 auto;
        min-height: 43px;
    }

    .chart-section {
        height: 190px;
    }

    .records-section {
        padding: 5px 12px 20px;
    }

    .records-toolbar {
        flex-direction: column;
        align-items: stretch;
    }

    .search-box {
        width: 80%;
        align-self: center;
        min-height: 46px;
    }

    .records-count {
        text-align: center;
    }

    .table-wrap {
        overflow-x: auto;
    }

    .table {
        min-width: 760px;
    }

    .table-header,
    .record-row {
        grid-template-columns:
            125px
            115px
            minmax(250px, 1fr)
            85px
            65px;
    }

    .th,
    .td {
        padding: 13px 9px;
    }

    .row-actions {
        opacity: 1;
    }

    .record-row.swiping {
        transform: translateX(-78px);
    }

    .mobile-delete {
        display: block;
    }

    .modal-backdrop {
        padding: 8px;
        align-items: flex-end;
    }

    .modal {
        width: 100%;
        max-height: 92vh;
        border-radius: 18px 18px 0 0;
    }

    .modal-footer {
        flex-wrap: wrap;
    }

    .modal-footer button {
        min-height: 46px;
        flex: 1;
    }

    .location-line {
        flex-direction: column;
    }

    .map-btn {
        min-height: 46px;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

    <div class="brand-area">
        <div class="brand">💰 我的記帳本</div>

        <button id="authBtn" class="auth-btn" type="button">
            登入/登出
        </button>
    </div>

    <div class="header-actions">

        <label class="font-control">
            🔤
            <input
                id="fontSizeRange"
                type="range"
                min="14"
                max="21"
                step="1"
                value="16"
                title="調整字體大小"
            >
        </label>

        <button id="themeBtn" class="header-btn">
            🌓 深色/淺色
        </button>

        <div class="data-menu" id="dataMenu">
            <button class="header-btn" id="dataMenuBtn">
                📁 資料
            </button>

            <div class="data-menu-panel">

                <button id="exportBtn">
                    📤 匯出資料
                </button>

                <button id="importBtn">
                    📥 匯入資料
                </button>

                <button id="clearBtn">
                    🗑️ 清空所有記錄
                </button>

                <input
                    id="fileInput"
                    type="file"
                    accept=".csv,.json,application/json,text/csv"
                    hidden
                >
            </div>
        </div>

        <button id="addBtn" class="header-btn add-btn">
            ➕
        </button>

    </div>

</header>


<section class="dashboard">

    <div class="stats">

        <div class="stat-card">
            <div class="stat-title">總消費次數</div>
            <div id="totalCount" class="stat-number">0</div>
        </div>

        <div class="stat-card">
            <div class="stat-title">總消費金額（NTD）</div>
            <div id="totalAmount" class="stat-number">$0.00</div>
        </div>

    </div>


    <div class="filters">

        <button
            class="filter-btn active"
            data-period="all"
        >
            📋 全部
        </button>

        <button
            class="filter-btn"
            data-period="today"
        >
            📅 今日
        </button>

        <button
            class="filter-btn"
            data-period="week"
        >
            📅 本週
        </button>

        <button
            class="filter-btn"
            data-period="month"
        >
            📅 本月
        </button>

    </div>


    <div class="chart-section">

        <canvas id="categoryChart"></canvas>

        <div id="noChart" class="no-chart">
            無資料可視化
        </div>

    </div>

</section>


<section class="records-section">

    <div class="records-card">

        <div class="records-toolbar">

            <input
                id="searchInput"
                class="search-box"
                type="search"
                placeholder="🔍 搜尋消費內容或地點..."
            >

            <div id="recordsCount" class="records-count">
                0 筆
            </div>

        </div>


        <div class="table-wrap">

            <div class="table">

                <!--
                    注意：
                    下面表頭和 .record-row 使用完全相同的
                    grid-template-columns，
                    因此欄位會精準對齊。
                -->

                <div class="table-header">

                    <div class="th">
                        <button
                            class="sort-btn"
                            data-sort="amount"
                        >
                            消費金額 ↕
                        </button>
                    </div>

                    <div class="th">
                        <span>消費類別</span>

                        <span class="filter-category">

                            <button
                                id="categoryFilterBtn"
                                class="funnel-btn"
                                title="類別篩選"
                            >
                                🔽
                            </button>

                            <div
                                id="categoryMenu"
                                class="category-menu"
                            >

                                <button
                                    class="category-option active"
                                    data-category="all"
                                >
                                    ✓ 全部類別
                                </button>

                                <button
                                    class="category-option"
                                    data-category="餐飲"
                                >
                                    🍜 餐飲
                                </button>

                                <button
                                    class="category-option"
                                    data-category="交通"
                                >
                                    🚗 交通
                                </button>

                                <button
                                    class="category-option"
                                    data-category="購物"
                                >
                                    🛍️ 購物
                                </button>

                                <button
                                    class="category-option"
                                    data-category="娛樂"
                                >
                                    🎮 娛樂
                                </button>

                                <button
                                    class="category-option"
                                    data-category="房租"
                                >
                                    🏠 房租
                                </button>

                                <button
                                    class="category-option"
                                    data-category="醫療"
                                >
                                    🏥 醫療
                                </button>

                                <button
                                    class="category-option"
                                    data-category="其他"
                                >
                                    📦 其他
                                </button>

                            </div>

                        </span>
                    </div>

                    <div class="th">
                        <button
                            class="sort-btn"
                            data-sort="content"
                        >
                            消費內容 ↕
                        </button>
                    </div>

                    <div class="th">
                        <button
                            class="sort-btn"
                            data-sort="id"

<script type="module">

/* ============================================================
   Firebase
   ============================================================

   Firebase Web API Key 放在前端是正常的。
   真正限制資料存取的是 Firestore Security Rules。

   你的 Rules：

   rules_version = '2';

   service cloud.firestore {

     match /databases/{database}/documents {

       match /users/{userId}/{document=**} {

         allow read, write:
           if request.auth != null
           && request.auth.uid == userId;

       }

     }

   }

   本程式使用：

   users/
      {Google UID}/
          accountingRecords/

   ============================================================ */

import {

/* ============================================================

/* ============================================================

   ============================================================ */

const STORAGE_KEY =

const THEME_KEY =

const FONT_KEY =
    "accountingFontSize";


let currentUser = null;

let unsubscribeFirestore = null;

let records = loadLocal();

/* ============================================================
   Helpers
   ============================================================ */

function $(id) {
    return document.getElementById(id);
}


function money(value) {

    return Number(value || 0)
        .toLocaleString("zh-TW", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });

}


function nowForDatetimeLocal() {

    const d = new Date();

    const offset =
        d.getTimezoneOffset();

    return new Date(
        d.getTime() -
        offset * 60000
    )
    .toISOString()
    .slice(0, 16);

}


function loadLocal() {

    try {

        const raw =
            localStorage.getItem(STORAGE_KEY);

        if (!raw) return [];

        const data =
            JSON.parse(raw);

        if (!Array.isArray(data))
            return [];

        return data
            .map(normalizeRecord)
            .filter(Boolean);

    } catch {

        return [];

    }

}


function saveLocal() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(records)
    );

}


function normalizeRecord(record) {

    if (!record)
        return null;

    return {

        id:
            Number(record.id),

        amount:
            Number(record.amount || 0),

        content:
            String(record.content || ""),

        time:
            String(record.time || ""),

        location:
            String(record.location || ""),

        category:
            record.category || "其他"

    };

}


function nextId() {

    if (!records.length)
        return 1;

    return Math.max(
        ...records.map(r => Number(r.id) || 0)
    ) + 1;

}


function showToast(message) {

    const toast =
        document.createElement("div");

    toast.className =
        "toast";

    toast.textContent =
        message;

    $("toastContainer")
        .appendChild(toast);

    setTimeout(() => {

        toast.remove();

    }, 2100);

}


/* ============================================================
   Firebase Paths
   ============================================================ */

function cloudCollection() {

    if (!currentUser)
        return null;

    return collection(
        db,
        "users",
        currentUser.uid,
        "accountingRecords"
    );

}


function cloudDoc(id) {

    return doc(
        db,
        "users",
        currentUser.uid,
        "accountingRecords",
        String(id)
    );

}


/* ============================================================
   Firebase Sync
   ============================================================ */

async function syncRecordToFirebase(record) {

    if (!currentUser)
        return;

    try {

        await setDoc(
            cloudDoc(record.id),
            record
        );

    } catch (error) {

        console.error(error);

        showToast(
            "雲端同步失敗，本機資料仍已保存"
        );

    }

}


async function deleteRecordFromFirebase(id) {

    if (!currentUser)
        return;

    try {

        await deleteDoc(
            cloudDoc(id)
        );

    } catch (error) {

        console.error(error);

        showToast(
            "Firebase 刪除失敗"
        );

    }

}


async function uploadLocalToFirebase() {

    if (!currentUser)
        return;

    if (!records.length)
        return;

    try {

        const batch =
            writeBatch(db);

        records.forEach(record => {

            batch.set(
                cloudDoc(record.id),
                record
            );

        });

        await batch.commit();

    } catch (error) {

        console.error(error);

        showToast(
            "本機資料上傳失敗"
        );

    }

}


/* ============================================================
   Firebase Listener
   ============================================================ */

function startFirebaseListener() {

    if (unsubscribeFirestore) {

        unsubscribeFirestore();

        unsubscribeFirestore = null;

    }

    if (!currentUser)
        return;


    unsubscribeFirestore =
        onSnapshot(
            cloudCollection(),

            snapshot => {

                const cloudRecords =
                    snapshot.docs
                        .map(docSnap =>
                            normalizeRecord(
                                docSnap.data()
                            )
                        )
                        .filter(Boolean)
                        .sort(
                            (a, b) =>
                                a.id - b.id
                        );


                records =
                    cloudRecords;

                saveLocal();

                render();

            },

            error => {

                console.error(error);

                showToast(
                    "無法讀取 Firebase 資料"
                );

            }
        );

}

}

   Auth State

onAuthStateChanged(

             如果雲端沒有資料，

             上傳到該 Google 帳號。
            */

            try {

                const snapshot =
                    await getDocs(
                        cloudCollection()
                    );

                if (
                    snapshot.empty &&

                ) {

                    await uploadLocalToFirebase();

                }

            } catch (error) {

            }


            startFirebaseListener();

            showToast(

        } else {

                unsubscribeFirestore();

            showToast(
                "已登出，目前使用本機資料"
            );

            render();

        }

    }
);


/* ============================================================
   Date Filters
   ============================================================ */

function isInPeriod(record) {

    if (currentPeriod === "all")
        return true;

    const date =
        new Date(record.time);

    if (Number.isNaN(date.getTime()))
        return false;

    const now =
        new Date();


    if (currentPeriod === "today") {

        return (
            date.getFullYear() ===
                now.getFullYear() &&

            date.getMonth() ===
                now.getMonth() &&

            date.getDate() ===
                now.getDate()
        );

    }


    if (currentPeriod === "week") {

        const current =
            new Date(now);

        current.setHours(
            0, 0, 0, 0
        );

        const day =
            current.getDay();

        const mondayOffset =
            day === 0 ? 6 : day - 1;

        current.setDate(
            current.getDate() -
            mondayOffset
        );

        const end =
            new Date(current);

        end.setDate(
            end.getDate() + 7
        );

        return (
            date >= current &&
            date < end
        );

    }


    if (currentPeriod === "month") {

        return (
            date.getFullYear() ===
                now.getFullYear() &&

            date.getMonth() ===
                now.getMonth()
        );

    }


    return true;

}


/* ============================================================
   Filtering
   ============================================================ */

function filteredRecords() {

    const keyword =
        currentSearch
            .trim()
            .toLowerCase();


    let result =
        records.filter(record => {

            if (
                !isInPeriod(record)
            )
                return false;


            if (
                currentCategory !==
                "all" &&
                record.category !==
                currentCategory
            )
                return false;


            if (keyword) {

                const content =
                    record.content
                        .toLowerCase();

                const location =
                    record.location
                        .toLowerCase();

                if (
                    !content.includes(keyword) &&
                    !location.includes(keyword)
                ) {

                    return false;

                }

            }


            return true;

        });


    result.sort((a, b) => {

        let av =
            a[sortKey];

        let bv =
            b[sortKey];


        if (
            sortKey === "amount" ||
            sortKey === "id"
        ) {

            av = Number(av);

            bv = Number(bv);

        } else {

            av =
                String(av || "")
                    .toLowerCase();

            bv =
                String(bv || "")
                    .toLowerCase();

        }


        if (av < bv)
            return -1 * sortDirection;

        if (av > bv)
            return 1 * sortDirection;

        return 0;

    });


    return result;

}


/* ============================================================
   Render
   ============================================================ */

function render() {

    const list =
        filteredRecords();


    $("totalCount").textContent =
        list.length;


    const total =
        list.reduce(
            (sum, record) =>
                sum + Number(record.amount || 0),
            0
        );


    $("totalAmount").textContent =
        "$" + money(total);


    $("recordsCount").textContent =
        list.length + " 筆";


    renderList(list);

    renderChart(list);

}


function renderList(list) {

    const container =
        $("recordList");

    container.innerHTML = "";


    if (!list.length) {

        container.innerHTML = `
            <div class="empty">
                📭 沒有符合條件的消費記錄
            </div>
        `;

        return;

    }


    list.forEach(record => {

        const row =
            document.createElement("div");

        row.className =
            "record-row";

        row.dataset.id =
            record.id;


        row.innerHTML = `

            <div class="td amount">
                NTD ${money(record.amount)}
            </div>

            <div class="td">
                <span class="category-tag cat-${escapeHTML(record.category)}">
                    ${escapeHTML(record.category)}
                </span>
            </div>

            <div class="td">
                ${escapeHTML(record.content)}
            </div>

            <div class="td">
                #${record.id}
            </div>

            <div class="td">

                <div class="row-actions">

                    <button
                        class="icon-btn"
                        data-action="edit"
                        title="編輯"
                    >
                        ✏️
                    </button>

                    <button
                        class="icon-btn delete-icon"
                        data-action="delete"
                        title="刪除"
                    >
                        🗑️
                    </button>

                </div>

            </div>

            <button
                class="mobile-delete"
                data-action="delete"
            >
                刪除
            </button>

        `;


        row.addEventListener(
            "click",
            event => {

                if (
                    event.target.closest(
                        "button"
                    )
                )
                    return;


                if (
                    row.classList.contains(
                        "swiping"
                    )
                ) {

                    row.classList.remove(
                        "swiping"
                    );

                    return;

                }


                openDetail(record.id);

            }
        );


        row.addEventListener(
            "touchstart",
            event => {

                touchStartX =
                    event.touches[0].clientX;

            },
            {
                passive: true
            }
        );


        row.addEventListener(
            "touchend",
            event => {

                const endX =
                    event.changedTouches[0]
                        .clientX;

                const distance =
                    touchStartX - endX;


                if (
                    distance > 60 &&
                    window.innerWidth <= 600
                ) {

                    row.classList.add(
                        "swiping"
                    );

                }

            },
            {
                passive: true
            }
        );


        row.querySelectorAll(
            "[data-action]"
        ).forEach(button => {

            button.addEventListener(
                "click",
                async event => {

                    event.stopPropagation();

                    const action =
                        button.dataset.action;


                    if (
                        action === "edit"
                    ) {

                        openForm(
                            record.id
                        );

                    }


                    if (
                        action === "delete"
                    ) {

                        await deleteRecord(
                            record.id
                        );

                    }

                }
            );

        });


        container.appendChild(row);

    });

}


/* ============================================================
   Escape HTML
============================================================ */

function escapeHTML(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* ============================================================
   Chart
============================================================ */

function renderChart(list) {

    const canvas =
        $("categoryChart");

    const noChart =
        $("noChart");


    const totals = {

        "餐飲": 0,
        "交通": 0,
        "購物": 0,
        "娛樂": 0,
        "房租": 0,
        "醫療": 0,
        "其他": 0

    };


    list.forEach(record => {

        const category =
            totals.hasOwnProperty(
                record.category
            )
            ? record.category
            : "其他";


        totals[category] +=
            Number(record.amount || 0);

    });


    const labels =
        Object.keys(totals)
            .filter(
                category =>
                    totals[category] > 0
            );


    const values =
        labels.map(
            category =>
                totals[category]
        );


    if (!labels.length) {

        if (chart) {

            chart.destroy();

            chart = null;

        }

        canvas.style.display =
            "none";

        noChart.style.display =
            "flex";

        return;

    }


    canvas.style.display =
        "block";

    noChart.style.display =
        "none";


    if (chart)
        chart.destroy();


    chart =
        new Chart(
            canvas,
            {

                type: "pie",

                data: {

                    labels,

                    datasets: [{

                        data: values

                    }]

                },

                options: {

                    responsive: true,

                    maintainAspectRatio: false,

                    plugins: {

                        legend: {

                            position: "right"

                        }

                    }

                }

            }
        );

}

                    }

function formatDate(value) {

    const date =
        new Date(value);

    if (
        Number.isNaN(
            date.getTime()
        )
    )
        return value || "未填寫";


    return date.toLocaleString(
        "zh-TW",
        {
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/* ============================================================
   Form
============================================================ */

function openForm(id = null) {

    editingId =
        id === null

    $("formTitle").textContent =
        editingId === null
            ? "➕ 新增消費記錄"
            : "✏️ 編輯消費記錄";


    $("saveBtn").textContent =
        editingId === null
            ? "確定新增"
            : "儲存修改";


    if (editingId === null) {

        $("amountInput").value = "";

        $("contentInput").value = "";

        $("timeInput").value =
            nowForDatetimeLocal();

        $("locationInput").value = "";

        $("categoryInput").value =
            "餐飲";

    } else {

        const record =
            records.find(
                r => r.id === editingId
            );


        if (!record)
            return;


        $("amountInput").value =
            record.amount;

        $("contentInput").value =
            record.content;

        $("timeInput").value =
            toDatetimeLocal(
                record.time
            );

        $("locationInput").value =
            record.location;

        $("categoryInput").value =
            record.category;

    }


    openModal("formModal");

}


function toDatetimeLocal(value) {

    const date =
        new Date(value);

    if (
        Number.isNaN(
            date.getTime()
        )
    )
        return nowForDatetimeLocal();


    const offset =
        date.getTimezoneOffset();


    return new Date(
        date.getTime() -
        offset * 60000
    )
    .toISOString()
    .slice(0, 16);

}


/* ============================================================
   Save Record
============================================================ */

async function saveRecord() {

    const amount =
        Number(
            $("amountInput").value
        );


    const content =
        $("contentInput")
            .value
            .trim();


    const time =
        $("timeInput").value;


    const location =
        $("locationInput")
            .value
            .trim();


    const category =
        $("categoryInput").value;


    if (
        !Number.isFinite(amount) ||
        amount < 0
    ) {

        alert(
            "請輸入有效的消費金額"
        );

        return;

    }


    if (!content) {

        alert(
            "請輸入消費內容"
        );

        return;

    }


    if (!time) {

        alert(
            "請選擇消費時間"
        );

        return;

    }


    const data = {

        amount:
            Number(
                amount.toFixed(2)
            ),

        content,

        time:
            new Date(time)
                .toISOString(),

        location,

        category

    };


    if (editingId === null) {

        const record = {

            id: nextId(),

            ...data

        };


        records.push(record);

        saveLocal();

        await syncRecordToFirebase(
            record
        );


        closeModal("formModal");

        render();

        showToast(
            "新增成功"
        );

    } else {

        const index =
            records.findIndex(
                r =>
                    r.id ===
                    editingId
            );


        if (index < 0)
            return;


        records[index] = {

            ...records[index],

            ...data

        };


        saveLocal();

        await syncRecordToFirebase(
            records[index]
        );


        closeModal("formModal");

        closeModal("detailModal");

        render();

        showToast(
            "修改成功"
        );

    }

}

async function deleteRecord(id) {

        records.find(

    const confirmed =
        confirm(
            `確認刪除？\n\n#${record.id} ${record.content}\nNTD ${money(record.amount)}`
        );


    if (!confirmed)
        return;


    records =
        records.filter(
            r =>
                r.id !==
                Number(id)
        );


    saveLocal();

    await deleteRecordFromFirebase(
        Number(id)
    );


    if (
        selectedRecordId ===

            "detailModal"
        );

        selectedRecordId =

    );

}

$("exportBtn")
    .addEventListener(
        "click",
        () => {

            if (!records.length) {

                alert(
                    "目前沒有可匯出的資料"
                );

                return;

            }


            /*
                第一四欄刻意固定為：

                消費序號
                消費內容
                消費金額
                消費時間

                方便 Excel 使用。
            */

            const headers = [

                "消費序號",
                "消費內容",
                "消費金額",
                "消費時間",
                "消費地點",
                "消費類別"

            ];


            const rows =
                records.map(
                    record => [

                        record.id,

                        record.content,

                        Number(
                            record.amount
                        ).toFixed(2),

                        formatDate(
                            record.time
                        ),

                        record.location,

                        record.category

                    ]
                );


            const csv = [

                headers,

                ...rows

            ]
            .map(
                row =>
                    row.map(
                        value =>
                            `"${String(
                                value ?? ""
                            )
                            .replaceAll(
                                '"',
                                '""'
                            )}"`
                    ).join(",")
            )
            .join("\r\n");


            /*
                UTF-8 BOM：

                讓 Windows Excel 正確辨識中文。
            */

            const blob =
                new Blob(
                    [
                        "\uFEFF" + csv
                    ],
                    {
                        type:
                            "text/csv;charset=utf-8;"
                    }
                );


            downloadBlob(
                blob,
                "我的記帳本.csv"
            );


            showToast(
                "CSV 匯出成功"
            );

        }
    );


function downloadBlob(
    blob,
    filename
) {

    const url =
        URL.createObjectURL(blob);


    const a =
        document.createElement("a");

    a.href = url;

    a.download =
        filename;

    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(url);

}

            }

        }
    );


/* ============================================================
   CSV Parser
============================================================ */

function parseCSV(text) {

    text =
        text.replace(
            /^\uFEFF/,
            ""
        );


    const lines =
        text
            .split(/\r?\n/)
            .filter(
                line =>
                    line.trim()
            );


    if (lines.length < 2)
        return [];


    const headers =
        parseCSVLine(
            lines[0]
        ).map(
            h =>
                h.trim()
        );


    return lines
        .slice(1)
        .map(line => {

            const row =
                parseCSVLine(line);


            const obj = {};


            headers.forEach(
                (header, index) => {

                    obj[header] =
                        row[index] ?? "";

                }
            );


            return {

                id:
                    Number(
                        obj["消費序號"] ||
                        obj["id"] ||
                        0
                    ),

                content:
                    obj["消費內容"] ||
                    obj["content"] ||
                    "",

                amount:
                    Number(
                        obj["消費金額"] ||
                        obj["amount"] ||
                        0
                    ),

                time:
                    obj["消費時間"] ||
                    obj["time"] ||
                    new Date()
                        .toISOString(),

                location:
                    obj["消費地點"] ||
                    obj["location"] ||
                    "",

                category:
                    obj["消費類別"] ||
                    obj["category"] ||
                    "其他"

            };

        });

}


function parseCSVLine(line) {

    const result = [];

    let current = "";

    let insideQuotes = false;


    for (
        let i = 0;
        i < line.length;
        i++
    ) {

        const char =
            line[i];


        if (
            char === '"' &&
            line[i + 1] === '"'
        ) {

            current += '"';

            i++;

            continue;

        }


        if (char === '"') {

            insideQuotes =
                !insideQuotes;

            continue;

        }


        if (
            char === "," &&
            !insideQuotes
        ) {

            result.push(
                current
            );

            current = "";

        } else {

            current += char;

        }

    }


    result.push(current);

    return result;

}

============================================================ */

function applyTheme() {

    const theme =
        localStorage.getItem(
            THEME_KEY
        ) || "light";


    if (theme === "dark") {

        document.documentElement
            .setAttribute(
                "data-theme",
                "dark"
            );

    } else {

        document.documentElement
            .removeAttribute(
                "data-theme"
            );

    }

}

    .addEventListener(
        "click",
        () => {

            const isDark =
                document.documentElement
                    .getAttribute(
                        "data-theme"
                    ) === "dark";


            if (isDark) {

                document.documentElement
                    .removeAttribute(
                        "data-theme"
                    );

                localStorage.setItem(
                    THEME_KEY,
                    "light"
                );

            } else {

                document.documentElement
                    .setAttribute(
                        "data-theme",
                        "dark"
                    );

                localStorage.setItem(
                    THEME_KEY,
                    "dark"
                );

            }
