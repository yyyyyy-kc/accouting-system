<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💰 我的記帳本</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#fff8d9;--surface:#fffdf1;--surface2:#fff0ad;--text:#503321;--muted:#8d6b4e;
  --primary:#edb735;--accent:#d76e28;--border:#e9d494;--danger:#b83d32;
  --shadow:0 8px 26px rgba(86,55,20,.10);--overlay:rgba(55,35,20,.5);
}
[data-theme="dark"]{
  --bg:#292017;--surface:#39291c;--surface2:#4b351f;--text:#fff0c3;--muted:#d4b88c;
  --primary:#efba45;--accent:#ef8a3c;--border:#6b4c2c;--danger:#ff7164;
  --shadow:0 10px 30px rgba(0,0,0,.3);--overlay:rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}button{cursor:pointer}
.app{min-height:100vh;display:grid;grid-template-rows:auto auto 1fr}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 24px;background:var(--surface);border-bottom:1px solid var(--border);box-shadow:0 2px 12px rgba(0,0,0,.05);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:14px}.brand h1{font-size:1.4rem;margin:0;white-space:nowrap}.auth{color:var(--muted);font-size:.9rem}
.header-actions{display:flex;align-items:center;gap:8px}.btn{padding:9px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-weight:800}.btn.primary{background:var(--primary);color:#4b2b0b;border-color:var(--primary)}.btn.danger{background:var(--danger);color:#fff}
.font-control{display:flex;align-items:center;gap:7px;padding:6px 9px;border:1px solid var(--border);border-radius:10px;background:var(--surface2);font-size:.82rem}.font-control input{width:90px;accent-color:var(--accent)}
.dropdown{position:relative}.dropdown-menu{position:absolute;right:0;top:calc(100% + 7px);display:none;min-width:190px;padding:6px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);z-index:60}.dropdown.open .dropdown-menu{display:block}.dropdown-menu button{display:block;width:100%;text-align:left;padding:10px;border:0;background:transparent;color:var(--text);border-radius:8px}.dropdown-menu button:hover{background:var(--surface2)}
.dashboard{padding:18px 24px 12px;background:var(--surface2);border-bottom:1px solid var(--border)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:1180px;margin:auto}.stat{padding:17px 20px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow)}.stat label{display:block;color:var(--muted);font-weight:800}.stat strong{display:block;color:var(--accent);font-size:clamp(1.9rem,4vw,3rem);line-height:1.15;margin-top:5px}
.quick-filters{display:flex;gap:8px;max-width:1180px;margin:13px auto 0;overflow-x:auto}.filter{flex:0 0 auto;padding:8px 13px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:800}.filter.active{background:var(--primary);color:#4b2b0b}
.main{width:100%;max-width:1180px;margin:auto;padding:12px 24px 24px;min-height:0;display:grid;grid-template-rows:240px 1fr;gap:13px}
.chart-card{height:240px;padding:10px 16px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow)}.chart-wrap{height:215px;position:relative}#noChart{display:none;position:absolute;inset:0;align-items:center;justify-content:center;color:var(--muted);font-weight:900}
.list-panel{min-height:0;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.toolbar{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--border)}.search{width:min(430px,100%);padding:10px 13px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);outline:none}
.table-head,.record{display:grid;grid-template-columns:115px 130px minmax(180px,1fr) 115px 88px;align-items:center}.table-head{padding:8px 14px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:.85rem;color:var(--muted);font-weight:900}.sort{background:transparent;border:0;color:inherit;font-weight:900;padding:4px;text-align:left}.filter-wrap{position:relative}.funnel{background:transparent;border:0;color:var(--muted);font-size:1rem;padding:3px}.cat-menu{display:none;position:absolute;top:30px;left:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:5px;z-index:40;min-width:130px}.cat-menu.open{display:block}.cat-menu button{display:block;width:100%;padding:8px;border:0;background:transparent;color:var(--text);text-align:left;border-radius:7px}.cat-menu button:hover{background:var(--surface2)}
.records{overflow:auto}.record-shell{position:relative;overflow:hidden;border-bottom:1px solid var(--border)}.record{position:relative;z-index:2;min-height:60px;padding:10px 14px;background:var(--surface);transition:transform .2s}.record:hover{background:var(--surface2)}.record>div{min-width:0}.content{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.amount{font-weight:900;color:var(--accent);text-align:right}.tag{display:inline-block;padding:4px 8px;border-radius:999px;font-size:.76rem;font-weight:900}.actions{display:flex;justify-content:flex-end;gap:5px;opacity:0;transition:.15s}.record-shell:hover .actions{opacity:1}.icon{width:31px;height:31px;border-radius:8px;border:1px solid var(--border);background:var(--surface2)}.icon.del{color:var(--danger)}.swipe-actions{position:absolute;right:0;top:0;bottom:0;width:88px;background:var(--danger);display:flex;align-items:center;justify-content:center}.swipe-actions button{background:transparent;color:#fff;font-weight:900;border:0}
.empty{text-align:center;padding:38px 20px;color:var(--muted)}
.backdrop{position:fixed;inset:0;background:var(--overlay);display:none;align-items:center;justify-content:center;padding:15px;z-index:100}.backdrop.show{display:flex}.modal{width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:0 25px 70px rgba(0,0,0,.3)}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:15px 18px;border-bottom:1px solid var(--border)}.modal-head h2{margin:0;font-size:1.2rem}.close{width:35px;height:35px;border:0;border-radius:9px;background:var(--surface2);color:var(--text)}.modal-body{padding:18px}.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:13px 18px;border-top:1px solid var(--border);flex-wrap:wrap}
.details{display:grid;grid-template-columns:1fr 1fr;gap:11px}.detail{padding:12px;background:var(--surface2);border-radius:11px}.detail.full{grid-column:1/-1}.detail small{display:block;color:var(--muted);font-weight:800;margin-bottom:4px}.detail strong{word-break:break-word}
.form{display:grid;gap:13px}.field label{display:block;font-weight:800;margin-bottom:6px}.field input,.field select{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text)}.amount-row{display:grid;grid-template-columns:1fr auto;gap:7px}.quick{display:flex;gap:5px;align-items:end}.quick button{height:43px;padding:0 9px;border:1px solid var(--border);border-radius:8px;background:var(--surface2);color:var(--text);font-weight:800}.location-row{display:grid;grid-template-columns:1fr auto;gap:7px}
.toast{position:fixed;top:70px;left:50%;transform:translate(-50%,-10px);opacity:0;background:var(--text);color:var(--bg);padding:9px 15px;border-radius:999px;font-weight:900;z-index:200;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:700px){header{padding:11px 14px;align-items:flex-start}.brand{flex-wrap:wrap;gap:7px}.header-actions{flex-wrap:wrap;justify-content:flex-end}.main{padding:10px 14px 18px}.dashboard{padding:12px 14px 9px}.table-head{display:none}.record{grid-template-columns:92px 90px minmax(150px,1fr) 92px 36px;padding:10px 9px}.actions{opacity:1}.icon.edit{display:none}}
@media(max-width:599px){
  body{font-size:17px}.app{grid-template-rows:auto auto 1fr}header{position:relative}.brand h1{font-size:1.25rem}.auth{font-size:.95rem}.header-actions{width:100%;justify-content:stretch}.header-actions>*{flex:1}.font-control{justify-content:center}.font-control input{width:75px}.dropdown>.btn{width:100%}.stats{grid-template-columns:1fr;gap:8px}.stat{padding:14px}.stat strong{font-size:2rem}.filter{padding:10px 14px}.main{grid-template-rows:225px 1fr}.chart-card{height:225px}.chart-wrap{height:200px}.toolbar{padding:10px}.search{width:72%;padding:12px;font-size:17px}.table-head{display:none}.record{grid-template-columns:84px 82px minmax(150px,1fr) 88px 36px;min-width:440px;min-height:67px}.records{overflow-x:auto}.record-shell{min-width:440px}.icon{width:35px;height:35px}.modal{max-height:94vh}.details{grid-template-columns:1fr}.detail.full{grid-column:auto}.modal-foot .btn{min-height:45px;flex:1}.field input,.field select{font-size:17px;padding:13px}.quick button{height:47px;padding:0 11px}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">
    <h1>💰 我的記帳本</h1>
    <span class="auth">登入/登出</span>
  </div>
  <div class="header-actions">
    <div class="font-control" title="調整介面字體大小">A <input id="fontSize" type="range" min="14" max="21" value="16" step="1"> A+</div>
    <button class="btn" id="themeBtn">🌓 模式</button>
    <div class="dropdown" id="dataDrop">
      <button class="btn" id="dataBtn">⇅ 資料</button>
      <div class="dropdown-menu">
        <button id="exportBtn">📤 匯出 CSV</button>
        <button id="importBtn">📥 匯入 CSV / JSON</button>
        <button id="clearBtn">🗑️ 清空所有記錄</button>
      </div>
    </div>
    <button class="btn primary" id="addBtn">＋</button>
    <input id="fileInput" type="file" accept=".csv,.json,text/csv,application/json" hidden>
  </div>
</header>

<section class="dashboard">
  <div class="stats">
    <div class="stat"><label>總消費次數</label><strong id="count">0</strong></div>
    <div class="stat"><label>總消費金額（NTD）</label><strong id="total">$0.00</strong></div>
  </div>
  <div class="quick-filters" id="quickFilters">
    <button class="filter active" data-period="all">📊 全部</button>
    <button class="filter" data-period="today">📅 今日</button>
    <button class="filter" data-period="week">📅 本週</button>
    <button class="filter" data-period="month">📅 本月</button>
  </div>
</section>

<main class="main">
  <div class="chart-card"><div class="chart-wrap"><canvas id="chart"></canvas><div id="noChart">無資料可視化</div></div></div>
  <section class="list-panel">
    <div class="toolbar"><input class="search" id="search" type="search" placeholder="🔎 搜尋內容或地點"></div>
    <div class="table-head">
      <div class="filter-wrap">
        <button class="sort" data-sort="id">消費序號 ↕</button>
      </div>
      <div class="filter-wrap">
        <button class="sort" data-sort="category">消費類別 ↕</button>
        <button class="funnel" id="funnel" title="類別篩選">⏷</button>
        <div class="cat-menu" id="catMenu"></div>
      </div>
      <button class="sort" data-sort="content">消費內容 ↕</button>
      <button class="sort" data-sort="amount">消費金額 ↕</button>
      <span></span>
    </div>
    <div class="records" id="records"></div>
  </section>
</main>
</div>

<div class="toast" id="toast"></div>

<div class="backdrop" id="detailModal">
  <div class="modal">
    <div class="modal-head"><h2>📋 消費詳情</h2><button class="close" data-close="detailModal">✕</button></div>
    <div class="modal-body"><div class="details" id="details"></div></div>
    <div class="modal-foot">
      <button class="btn" id="copyBtn">📄 複製此筆</button>
      <button class="btn" id="editBtn">✏️ 編輯</button>
      <button class="btn danger" id="deleteBtn">🗑️ 刪除</button>
    </div>
  </div>
</div>

<div class="backdrop" id="formModal">
  <div class="modal">
    <div class="modal-head"><h2 id="formTitle">➕ 新增記錄</h2><button class="close" data-close="formModal">✕</button></div>
    <div class="modal-body">
      <form class="form" id="form">
        <input id="recordId" type="hidden">
        <div class="field"><label>消費金額（NTD）</label><div class="amount-row"><input id="amount" type="number" min="0" step="0.01" required><div class="quick"><button type="button" data-add="100">+100</button><button type="button" data-add="500">+500</button><button type="button" data-add="1000">+1000</button></div></div></div>
        <div class="field"><label>消費內容</label><input id="content" type="text" maxlength="100" required placeholder="例如：午餐"></div>
        <div class="field"><label>消費時間</label><input id="time" type="datetime-local" required></div>
        <div class="field"><label>消費地點</label><div class="location-row"><input id="location" type="text" maxlength="100" placeholder="例如：台北車站"><button class="btn" type="button" id="mapBtn">🗺️ 地圖</button></div></div>
        <div class="field"><label>消費類別</label><select id="category" required></select></div>
      </form>
    </div>
    <div class="modal-foot"><button class="btn" data-close="formModal">取消</button><button class="btn primary" id="saveBtn">確定新增</button></div>
  </div>
</div>

<script>
/*
 Firebase / Google 登入預留說明：
 1. 本檔案目前預設以 localStorage 運作，直接開啟 HTML 即可使用。
 2. 若要啟用 Firebase，請在本檔案加入 Firebase Web SDK CDN，並把下方
    firebaseConfig 填入 Firebase Console > Project settings > Your apps 的設定。
 3. 啟用 Authentication > Google，登入後以 user.uid 作為資料路徑，例如：
    users/{uid}/accountingRecords/{recordId}
 4. 將 load/save/add/edit/delete 改為 Firebase Firestore onSnapshot / addDoc /
    updateDoc / deleteDoc；localStorage 可保留作離線快取。
 5. Firebase 本身需要網路與 Firebase 專案設定；未填 config 時，本檔案完全不依賴後端。
*/
const STORAGE_KEY='accountingRecords';
const THEME_KEY='accountingTheme';
const FONT_KEY='accountingFontSize';
const categories=['餐飲','交通','購物','娛樂','房租','醫療','其他'];
const colors={'餐飲':'#e57373','交通':'#64b5f6','購物':'#ba68c8','娛樂':'#ffb74d','房租':'#81c784','醫療':'#4db6ac','其他':'#90a4ae'};
let records=load(), period='all', categoryFilter='all', searchTerm='', sortKey='id', sortDir=-1, selected=null, chart=null, swiped=null, touchX=0;

const $=id=>document.getElementById(id);
function load(){try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');return Array.isArray(x)?x.map(norm).filter(Boolean):[]}catch{return[]}}
function norm(r){const amount=Number(r?.amount);if(!Number.isFinite(amount))return null;return{id:Number(r.id)||0,amount:Math.round(amount*100)/100,content:String(r.content??''),time:String(r.time??''),location:String(r.location??''),category:categories.includes(r.category)?r.category:'其他'}}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(records))}
function nextId(){return records.reduce((m,r)=>Math.max(m,Number(r.id)||0),0)+1}
function money(n){return Number(n||0).toLocaleString('zh-TW',{minimumFractionDigits:2,maximumFractionDigits:2})}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function dtLocal(d=new Date()){const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}
function showDate(s){const d=new Date(s);return isNaN(d)?s||'—':d.toLocaleString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
function startWeek(d){const x=new Date(d);x.setHours(0,0,0,0);const day=x.getDay();x.setDate(x.getDate()-(day===0?6:day-1));return x}
function inPeriod(r){
 if(period==='all')return true; const d=new Date(r.time),n=new Date();if(isNaN(d))return false;
 if(period==='today')return d.toDateString()===n.toDateString();
 if(period==='week')return d>=startWeek(n)&&d<=n;
 if(period==='month')return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth();
 return true;
}
function visible(){
 const q=searchTerm.trim().toLowerCase();
 return records.filter(r=>inPeriod(r)&&(categoryFilter==='all'||r.category===categoryFilter)&&(!q||r.content.toLowerCase().includes(q)||r.location.toLowerCase().includes(q)));
}
function render(){
 const data=visible(),sum=data.reduce((a,r)=>a+r.amount,0);
 $('count').textContent=data.length.toLocaleString('zh-TW');$('total').textContent='$'+money(sum);
 document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.period===period));
 renderList(data);renderChart(data);
}
function renderList(data){
 if(!data.length){$('records').innerHTML='<div class="empty">目前沒有符合條件的消費記錄。</div>';return}
 data=[...data].sort((a,b)=>{
   let av=a[sortKey],bv=b[sortKey];
   if(sortKey==='id'||sortKey==='amount'){av=Number(av);bv=Number(bv)}
   else if(sortKey==='time'){av=new Date(av).getTime();bv=new Date(bv).getTime()}
   else{av=String(av).toLowerCase();bv=String(bv).toLowerCase()}
   return av<bv?-1*sortDir:av>bv?1*sortDir:0;
 });
 $('records').innerHTML=data.map(r=>`<div class="record-shell" data-shell="${r.id}">
  <div class="swipe-actions"><button class="swipe-delete" data-id="${r.id}">刪除</button></div>
  <div class="record" data-id="${r.id}">
    <div class="amount">$${money(r.amount)}</div>
    <div><span class="tag" style="background:${colors[r.category]}22;color:${colors[r.category]};border:1px solid ${colors[r.category]}66">${esc(r.category)}</span></div>
    <div class="content" title="${esc(r.content)}">${esc(r.content)}</div>
    <div style="text-align:right">#${esc(r.id)}</div>
    <div class="actions"><button class="icon edit" data-edit="${r.id}" title="編輯">✏️</button><button class="icon del" data-del="${r.id}" title="刪除">🗑️</button></div>
  </div></div>`).join('');
}
function renderChart(data){
 const canvas=$('chart'),no=$('noChart'),sums={};data.forEach(r=>sums[r.category]=(sums[r.category]||0)+r.amount);
 const labels=Object.keys(sums);if(chart){chart.destroy();chart=null}
 if(!labels.length){canvas.style.display='none';no.style.display='flex';return}
 canvas.style.display='block';no.style.display='none';
 chart=new Chart(canvas,{type:'pie',data:{labels,datasets:[{data:labels.map(k=>sums[k]),backgroundColor:labels.map(k=>colors[k]),borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right'}}}});
}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),2000)}
function open(id){$(id).classList.add('show')}function close(id){$(id).classList.remove('show')}
function detail(id){
 const r=records.find(x=>x.id===Number(id));if(!r)return;selected=r.id;
 $('details').innerHTML=`<div class="detail"><small>消費金額</small><strong style="color:var(--accent)">$${money(r.amount)} NTD</strong></div><div class="detail"><small>消費類別</small><strong>${esc(r.category)}</strong></div><div class="detail"><small>消費序號</small><strong>#${r.id}</strong></div><div class="detail"><small>消費時間</small><strong>${esc(showDate(r.time))}</strong></div><div class="detail full"><small>消費內容</small><strong>${esc(r.content)}</strong></div><div class="detail full"><small>消費地點</small><strong>${esc(r.location||'未填寫')}</strong></div>`;
 open('detailModal');
}
function form(record=null){
 $('form').reset();$('recordId').value=record?.id||'';$('formTitle').textContent=record?'✏️ 編輯記錄':'➕ 新增記錄';$('saveBtn').textContent=record?'儲存修改':'確定新增';
 $('amount').value=record?record.amount:'';$('content').value=record?record.content:'';$('time').value=record?dtLocal(new Date(record.time)):dtLocal();$('location').value=record?record.location:'';$('category').value=record?record.category:'餐飲';close('detailModal');open('formModal');
}
function remove(id,fromDetail=false){
 const r=records.find(x=>x.id===Number(id));if(!r)return;
 if(!confirm(`確認刪除？\n\n#${r.id} ${r.content}\n$${money(r.amount)}`))return;
 records=records.filter(x=>x.id!==r.id);save();if(fromDetail)close('detailModal');render();toast('刪除成功');
}
function csvEscape(v){return `"${String(v??'').replace(/"/g,'""')}"`}
function exportCSV(){
 const head=['消費序號','消費內容','消費金額','消費時間','消費地點','消費類別'];
 const rows=records.map(r=>[r.id,r.content,r.amount,showDate(r.time),r.location,r.category]);
 const csv='\uFEFF'+[head,...rows].map(row=>row.map(csvEscape).join(',')).join('\r\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=`我的記帳本_${new Date().toISOString().slice(0,10)}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('CSV 匯出成功');
}
function parseCSV(text){
 const rows=[];let row=[],cell='',quote=false;
 for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'&&quote&&n==='"'){cell+='"';i++;continue}if(c==='"'){quote=!quote;continue}if(c===','&&!quote){row.push(cell);cell='';continue}if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&n==='\n')i++;row.push(cell);cell='';if(row.some(x=>x.trim()))rows.push(row);row=[];continue}cell+=c}
 if(cell||row.length){row.push(cell);rows.push(row)}
 if(!rows.length)return[];
 const h=rows[0].map(x=>x.trim());
 const map={id:'消費序號',content:'消費內容',amount:'消費金額',time:'消費時間',location:'消費地點',category:'消費類別'};
 return rows.slice(1).map(row=>{const o={};Object.entries(map).forEach(([k,name])=>{const i=h.indexOf(name);o[k]=i>=0?row[i]:''});return norm(o)}).filter(Boolean);
}
function importFile(file){
 const fr=new FileReader();fr.onload=()=>{try{let data;if(file.name.toLowerCase().endsWith('.json'))data=JSON.parse(fr.result);else data=parseCSV(fr.result);if(!Array.isArray(data))throw 0;if(!confirm(`匯入 ${data.length} 筆資料並取代目前記錄？`))return;records=data.map((r,i)=>({...r,id:i+1}));save();render();toast('匯入成功')}catch{alert('匯入失敗：CSV/JSON 格式不正確。')}};fr.readAsText(file,'utf-8');
}
$('category').innerHTML=categories.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
$('catMenu').innerHTML='<button data-cat="all">全部類別</button>'+categories.map(c=>`<button data-cat="${esc(c)}">${esc(c)}</button>`).join('');
$('quickFilters').addEventListener('click',e=>{const b=e.target.closest('.filter');if(b){period=b.dataset.period;render()}});
$('search').addEventListener('input',e=>{searchTerm=e.target.value;render()});
document.querySelectorAll('.sort').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.sort;if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=1}render()}));
$('funnel').addEventListener('click',e=>{e.stopPropagation();$('catMenu').classList.toggle('open')});
$('catMenu').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(b){categoryFilter=b.dataset.cat;$('catMenu').classList.remove('open');render()}});
document.addEventListener('click',()=>{$('catMenu').classList.remove('open');$('dataDrop').classList.remove('open')});
$('dataBtn').addEventListener('click',e=>{e.stopPropagation();$('dataDrop').classList.toggle('open')});
$('exportBtn').addEventListener('click',exportCSV);$('importBtn').addEventListener('click',()=>$('fileInput').click());$('clearBtn').addEventListener('click',()=>{if(!records.length){toast('目前沒有資料');return}if(confirm('第一次確認：確定清空所有記錄？')&&confirm('第二次確認：資料將從 localStorage 永久刪除，確定繼續？')){records=[];localStorage.removeItem(STORAGE_KEY);render();toast('所有記錄已清空')}});$('fileInput').addEventListener('change',e=>{if(e.target.files[0])importFile(e.target.files[0]);e.target.value=''});

$('addBtn').addEventListener('click',()=>form());
$('themeBtn').addEventListener('click',()=>{const dark=document.documentElement.dataset.theme==='dark';localStorage.setItem(THEME_KEY,dark?'light':'dark');applyTheme()});
function applyTheme(){document.documentElement.dataset.theme=localStorage.getItem(THEME_KEY)==='dark'?'dark':'light';if(chart)renderChart(visible())}
$('fontSize').value=localStorage.getItem(FONT_KEY)||16;document.documentElement.style.fontSize=$('fontSize').value+'px';$('fontSize').addEventListener('input',e=>{document.documentElement.style.fontSize=e.target.value+'px';localStorage.setItem(FONT_KEY,e.target.value)});
$('mapBtn').addEventListener('click',()=>window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent($('location').value.trim()||'我的位置'),'_blank','noopener,noreferrer'));
document.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>{$('amount').value=((Number($('amount').value)||0)+Number(b.dataset.add)).toFixed(2).replace(/\.00$/,'')}));
$('saveBtn').addEventListener('click',()=>{
 if(!$('form').reportValidity())return;
 const amount=Math.round(Number($('amount').value)*100)/100;if(!Number.isFinite(amount)||amount<0)return alert('請輸入有效金額');
 const data={amount,content:$('content').value.trim(),time:new Date($('time').value).toISOString(),location:$('location').value.trim(),category:$('category').value};
 const id=Number($('recordId').value);
 if(id){const i=records.findIndex(r=>r.id===id);if(i>=0)records[i]={...records[i],...data};save();close('formModal');render();toast('修改成功')}
 else{records.push({id:nextId(),...data});save();close('formModal');render();toast('新增成功')}
});
$('editBtn').addEventListener('click',()=>{const r=records.find(x=>x.id===selected);if(r)form(r)});
$('deleteBtn').addEventListener('click',()=>remove(selected,true));
$('copyBtn').addEventListener('click',()=>{const r=records.find(x=>x.id===selected);if(!r)return;records.push({...r,id:nextId(),time:new Date().toISOString()});save();close('detailModal');render();toast('已複製此筆，時間已更新為現在')});
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>close(b.dataset.close)));
document.querySelectorAll('.backdrop').forEach(x=>x.addEventListener('click',e=>{if(e.target===x)x.classList.remove('show')}));
$('records').addEventListener('click',e=>{const edit=e.target.closest('[data-edit]'),del=e.target.closest('[data-del]'),sw=e.target.closest('.swipe-delete'),row=e.target.closest('.record');if(edit){e.stopPropagation();const r=records.find(x=>x.id===Number(edit.dataset.edit));if(r)form(r);return}if(del){e.stopPropagation();remove(del.dataset.del);return}if(sw){e.stopPropagation();remove(sw.dataset.id);return}if(row)detail(row.dataset.id)});
$('records').addEventListener('touchstart',e=>{const shell=e.target.closest('.record-shell');if(!shell)return;touchX=e.changedTouches[0].clientX;if(swiped&&swiped!==shell){swiped.querySelector('.record').style.transform='translateX(0)';swiped=null}},{passive:true});
$('records').addEventListener('touchend',e=>{const shell=e.target.closest('.record-shell');if(!shell)return;const dx=e.changedTouches[0].clientX-touchX,r=shell.querySelector('.record');if(dx<-50){r.style.transform='translateX(-88px)';swiped=shell}else if(dx>50){r.style.transform='translateX(0)';swiped=null}},{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){close('detailModal');close('formModal')}});

applyTheme();render();
</script>
</body>
